<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#1a0e4a"/>

  <!-- White keys (6 keys, C D E F G A) -->
  <rect x="60"  y="148" width="58" height="216" rx="10" fill="#f2f2f2"/>
  <rect x="124" y="148" width="58" height="216" rx="10" fill="#f2f2f2"/>
  <rect x="188" y="148" width="58" height="216" rx="10" fill="#f2f2f2"/>
  <rect x="252" y="148" width="58" height="216" rx="10" fill="#f2f2f2"/>
  <rect x="316" y="148" width="58" height="216" rx="10" fill="#f2f2f2"/>
  <rect x="380" y="148" width="72" height="216" rx="10" fill="#f2f2f2"/>

  <!-- Key gaps (dark separators) -->
  <rect x="118" y="148" width="6"  height="216" rx="0" fill="#1a0e4a"/>
  <rect x="182" y="148" width="6"  height="216" rx="0" fill="#1a0e4a"/>
  <rect x="246" y="148" width="6"  height="216" rx="0" fill="#1a0e4a"/>
  <rect x="310" y="148" width="6"  height="216" rx="0" fill="#1a0e4a"/>
  <rect x="374" y="148" width="6"  height="216" rx="0" fill="#1a0e4a"/>

  <!-- Black keys -->
  <rect x="96"  y="148" width="44" height="136" rx="8" fill="#111"/>
  <rect x="160" y="148" width="44" height="136" rx="8" fill="#111"/>
  <rect x="288" y="148" width="44" height="136" rx="8" fill="#111"/>
  <rect x="352" y="148" width="44" height="136" rx="8" fill="#111"/>

  <!-- Accent: one key highlighted orange (brand color) -->
  <rect x="252" y="148" width="58" height="216" rx="10" fill="#F0A500" opacity="0.90"/>

  <!-- "M" lettermark subtle overlay -->
  <text x="256" y="430" font-family="sans-serif" font-weight="900" font-size="72"
        text-anchor="middle" fill="#6B47D6" opacity="0.55">M</text>
</svg>
