<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Manager — MyKey Content Studio</title>
  <link rel="stylesheet" href="themes/base-ui.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0f;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border:  #2a2a2a;
      --border2: #444;
      --text:    #d0d0d0;
      --muted:   #666;
      --orange:  #f0a500;
      --blue:    #4a9eff;
      --green:   #7ec87e;
      --red:     #e05050;
      --yellow:  #d4a838;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ---- Header ---- */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #111;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand-name { font-size: 15px; font-weight: 700; color: var(--orange); }
    .brand-sub  { font-size: 12px; color: var(--muted); }
    .header-back {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border2);
      padding: 5px 11px;
      border-radius: 6px;
      transition: color 0.12s, border-color 0.12s;
    }
    .header-back:hover { color: var(--orange); border-color: var(--orange); }

    /* ---- Main layout ---- */
    .main { max-width: 1400px; margin: 0 auto; padding: 24px; }

    /* ---- Buttons ---- */
    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--border2);
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text);
      background: var(--surface2);
      transition: background 0.12s, border-color 0.12s;
    }
    button:hover { background: #242424; border-color: var(--blue); }
    button:active { background: #1a1a1a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--orange);
      color: #000;
      border: 1px solid var(--orange);
      font-weight: 600;
    }
    .btn-primary:hover { background: #f5b543; border-color: #f5b543; }

    .btn-danger {
      color: var(--red);
    }
    .btn-danger:hover { background: rgba(224, 80, 80, 0.1); border-color: var(--red); }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    /* ---- Status bar ---- */
    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #1a1a1a;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      z-index: 10;
    }
    .status-msg {
      flex: 1;
      font-size: 12px;
      color: var(--text);
    }
    .status-msg.inf { color: var(--blue); }
    .status-msg.ok { color: var(--green); }
    .status-msg.err { color: var(--red); }

    /* ---- Toolbar ---- */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .toolbar-group {
      display: flex;
      gap: 8px;
    }
    .toolbar-sep {
      width: 1px;
      background: var(--border);
      margin: 0 4px;
    }

    /* ---- Table/List ---- */
    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
    }
    thead {
      background: #1a1a1a;
      border-bottom: 1px solid var(--border);
    }
    th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid var(--border2);
    }
    tbody tr:hover {
      background: rgba(74, 158, 255, 0.05);
    }

    /* ---- Form inputs ---- */
    input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      transition: border-color 0.12s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.1);
    }

    /* ---- Row actions ---- */
    .row-actions {
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }
    .row-actions button {
      padding: 4px 8px;
      font-size: 11px;
    }

    /* ---- Modal ---- */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      padding: 0;
      cursor: pointer;
    }
    .modal-close:hover { color: var(--text); }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .modal-actions button {
      flex: 1;
    }

    /* ---- Empty state ---- */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }
    .empty-state-icon {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* ---- Mini tags display ---- */
    .tags-display {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      background: rgba(74, 158, 255, 0.2);
      border: 1px solid var(--blue);
      color: var(--blue);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-name">📚 Library Manager</span>
    <span class="brand-sub">Manage index.json entries</span>
  </div>
  <a href="index.html" class="header-back">← Back</a>
</header>

<div class="main">
  <div class="toolbar">
    <div class="toolbar-group">
      <button id="btnLoadIndex" class="btn-primary">📂 Load index.json</button>
      <button id="btnSaveIndex" class="btn-primary" disabled>💾 Save index.json</button>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <button id="btnImportSong" class="btn-sm">⬆ Import song.json…</button>
      <button id="btnAddSong" class="btn-sm" disabled>+ Add Manual</button>
    </div>
  </div>

  <div id="listContainer">
    <div class="empty-state">
      <div class="empty-state-icon">📚</div>
      <div style="margin-bottom:8px">Load index.json yang sudah ada, atau langsung Import song.json untuk mulai</div>
      <div style="font-size:11px;color:var(--muted)">Import otomatis membaca metadata dari file song.json &amp; menambahkan ke index</div>
    </div>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <span class="status-msg inf" id="statusMsg">Ready</span>
</div>

<!-- Modal for editing entry -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <div class="modal-header">
      <span id="modalTitle">Edit Song Entry</span>
      <button class="modal-close" onclick="_closeEditModal()">✕</button>
    </div>
    <div id="editForm"></div>
  </div>
</div>

<script>
'use strict';

let _indexData = null;
let _editingIndex = -1;

// ========== LOAD ==========
async function _loadIndex() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      _indexData = JSON.parse(text);
      if (!Array.isArray(_indexData.songs)) _indexData.songs = [];
      _renderList();
      document.getElementById('btnSaveIndex').disabled = false;
      document.getElementById('btnAddSong').disabled = false;
      _setStatus('Loaded ✓ ' + _indexData.songs.length + ' entries — ' + file.name, 'ok');
    } catch(err) {
      _setStatus('JSON tidak valid: ' + err.message, 'err');
    }
  };
  inp.click();
}

// ========== IMPORT FROM song.json ==========
function _buildEntryFromSong(data, filename) {
  const m   = data.meta || {};
  const lib = data.library || {};
  const ts  = Array.isArray(m.time_signature) ? m.time_signature.join('/') : '?/?';
  const nb  = data.score?.bars?.length || 0;
  const segs = data.learning_segments?.length ? ' · segments' : '';
  const key  = (m.key_signature && m.key_signature !== 'C') ? ' · Key ' + m.key_signature : '';
  const label = `${m.title || 'Untitled'} — ${ts} · ${m.bpm || '?'} BPM · ${nb} bars${key}${segs}`;
  return {
    src:          'songs/' + filename,
    label,
    title:        (m.title || '').trim() || filename.replace(/\.json$/, ''),
    composer:     (m.composer || '').trim() || null,
    level:        m.level || null,
    collectionId: lib.collectionId ?? null,
    listed:       lib.listed !== undefined ? lib.listed : true,
    tags:         Array.isArray(lib.tags) ? lib.tags : [],
  };
}

async function _importSong() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.multiple = true;
  inp.onchange = async e => {
    const files = [...(e.target.files || [])];
    if (!files.length) return;

    if (!_indexData) {
      _indexData = { version: 2, songs: [] };
      document.getElementById('btnSaveIndex').disabled = false;
      document.getElementById('btnAddSong').disabled = false;
    }

    let added = 0, updated = 0, errors = 0;
    for (const file of files) {
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data?.score?.bars) { errors++; continue; }
        const entry = _buildEntryFromSong(data, file.name);
        const idx = _indexData.songs.findIndex(s => s.src === entry.src);
        if (idx >= 0) {
          _indexData.songs[idx] = { ..._indexData.songs[idx], ...entry };
          updated++;
        } else {
          _indexData.songs.push(entry);
          added++;
        }
      } catch { errors++; }
    }
    _renderList();
    const parts = [];
    if (added)   parts.push(added + ' ditambah');
    if (updated) parts.push(updated + ' diupdate');
    if (errors)  parts.push(errors + ' gagal/skip');
    _setStatus('Import: ' + parts.join(', ') + ' — klik Save untuk simpan', 'ok');
  };
  inp.click();
}

function _renderList() {
  if (!_indexData?.songs?.length) {
    document.getElementById('listContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>Belum ada entries</div></div>';
    return;
  }
  const songs = _indexData.songs;

  let html = '<div class="table-wrap"><table><thead><tr>' +
    '<th>Src</th>' +
    '<th>Title</th>' +
    '<th>Composer</th>' +
    '<th>Level</th>' +
    '<th>Listed</th>' +
    '<th>Collection</th>' +
    '<th>Tags</th>' +
    '<th style="text-align:center">Actions</th>' +
    '</tr></thead><tbody>';

  songs.forEach((song, idx) => {
    const tagsStr = Array.isArray(song.tags) ? song.tags.join(', ') : '';
    html += `<tr>
      <td><code style="font-size:11px;color:var(--muted)">${_esc(song.src || '')}</code></td>
      <td>${_esc(song.title || '—')}</td>
      <td>${_esc(song.composer || '—')}</td>
      <td>${_esc(song.level || '—')}</td>
      <td><strong>${song.listed ? '✓ yes' : '✗ no'}</strong></td>
      <td>${_esc(song.collectionId || '—')}</td>
      <td><div class="tags-display">${tagsStr ? tagsStr.split(',').map(t => '<span class="tag">' + _esc(t.trim()) + '</span>').join('') : '—'}</div></td>
      <td style="text-align:center">
        <div class="row-actions">
          <button class="btn-sm" onclick="_editSong(${idx})">Edit</button>
          <button class="btn-sm btn-danger" onclick="_deleteSong(${idx})">Delete</button>
        </div>
      </td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('listContainer').innerHTML = html;
}

// ========== EDIT/ADD ==========
function _editSong(idx) {
  _editingIndex = idx;
  const song = _indexData.songs[idx];
  _showEditModal(song, false);
}

function _addSong() {
  _editingIndex = -1;
  _showEditModal({
    src: 'songs/', label: '', title: 'New Song',
    composer: '', level: 'early_beginner',
    listed: true, collectionId: null, tags: []
  }, true);
}

function _showEditModal(song, isNew) {
  const modal = document.getElementById('editModal');
  const title = document.getElementById('modalTitle');
  title.textContent = isNew ? 'Add Song Entry' : 'Edit: ' + (song.title || song.src);

  const tags = Array.isArray(song.tags) ? song.tags.join(', ') : '';

  const formHtml = `
    <form id="editFormEl" onsubmit="_saveEditForm(event, ${isNew})">
      <div class="form-group">
        <label for="f_src">Src *</label>
        <input id="f_src" type="text" required value="${_esc(song.src || '')}" placeholder="songs/filename.json">
      </div>
      <div class="form-group">
        <label for="f_label">Label</label>
        <input id="f_label" type="text" value="${_esc(song.label || '')}" placeholder="Auto-generated">
      </div>
      <div class="form-group">
        <label for="f_title">Title *</label>
        <input id="f_title" type="text" required value="${_esc(song.title || '')}" placeholder="Song title">
      </div>
      <div class="form-group">
        <label for="f_composer">Composer</label>
        <input id="f_composer" type="text" value="${_esc(song.composer || '')}" placeholder="Composer name">
      </div>
      <div class="form-group">
        <label for="f_level">Level</label>
        <select id="f_level">
          <option value="early_beginner" ${song.level === 'early_beginner' ? 'selected' : ''}>Early Beginner</option>
          <option value="beginner" ${song.level === 'beginner' ? 'selected' : ''}>Beginner</option>
          <option value="intermediate" ${song.level === 'intermediate' ? 'selected' : ''}>Intermediate</option>
          <option value="advanced" ${song.level === 'advanced' ? 'selected' : ''}>Advanced</option>
        </select>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="f_listed" ${song.listed ? 'checked' : ''}>
          Listed (tampil di Song Browser)
        </label>
      </div>
      <div class="form-group">
        <label for="f_collectionId">Collection ID</label>
        <input id="f_collectionId" type="text" value="${_esc(song.collectionId || '')}" placeholder="Opsional">
      </div>
      <div class="form-group">
        <label for="f_tags">Tags (comma-separated)</label>
        <textarea id="f_tags" rows="2" placeholder="cat:repertoire, genre:folk">${_esc(tags)}</textarea>
      </div>
      <div class="modal-actions">
        <button type="button" onclick="_closeEditModal()" class="btn-sm">Batal</button>
        <button type="submit" class="btn-primary btn-sm">Simpan</button>
      </div>
    </form>
  `;

  document.getElementById('editForm').innerHTML = formHtml;
  modal.classList.add('show');
}

function _closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  _editingIndex = -1;
}

function _saveEditForm(e, isNew) {
  e.preventDefault();

  const song = {
    src:          document.getElementById('f_src').value.trim(),
    label:        document.getElementById('f_label').value.trim() || null,
    title:        document.getElementById('f_title').value.trim(),
    composer:     document.getElementById('f_composer').value.trim() || null,
    level:        document.getElementById('f_level').value,
    listed:       document.getElementById('f_listed').checked,
    collectionId: document.getElementById('f_collectionId').value.trim() || null,
    tags:         document.getElementById('f_tags').value.split(',').map(t => t.trim()).filter(t => t)
  };

  if (!song.src || !song.title) {
    alert('Src dan Title harus diisi');
    return;
  }

  if (isNew) {
    _indexData.songs.push(song);
  } else {
    _indexData.songs[_editingIndex] = song;
  }

  _renderList();
  _closeEditModal();
  _setStatus('Entry ' + (isNew ? 'added' : 'updated') + ' ✓ (unsaved)', 'ok');
}

function _deleteSong(idx) {
  if (!confirm('Hapus: ' + (_indexData.songs[idx].title || _indexData.songs[idx].src) + '?')) return;
  _indexData.songs.splice(idx, 1);
  _renderList();
  _setStatus('Entry deleted ✓ (unsaved)', 'ok');
}

// ========== SAVE ==========
async function _saveIndex() {
  if (!_indexData) return;
  const json = JSON.stringify(_indexData, null, 2) + '\n';

  if ('showSaveFilePicker' in window) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'index.json',
        types: [{ description: 'Index JSON', accept: { 'application/json': ['.json'] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      _setStatus('index.json tersimpan ✓ — pastikan di folder songs/', 'ok');
      return;
    } catch(e) {
      if (e.name === 'AbortError') { _setStatus('Batal', 'inf'); return; }
    }
  }

  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  _setStatus('index.json diunduh — pindahkan ke folder songs/', 'ok');
}

// ========== UI HELPERS ==========
function _setStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + (type || 'inf');
}

function _esc(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ========== INIT ==========
document.getElementById('btnLoadIndex').onclick  = _loadIndex;
document.getElementById('btnSaveIndex').onclick  = _saveIndex;
document.getElementById('btnAddSong').onclick    = _addSong;
document.getElementById('btnImportSong').onclick = _importSong;
</script>

</body>
</html>
