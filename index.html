<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MyKey Music Labs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a0e4a">
  <!-- iOS Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyKey">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="themes/base-ui.css">
  <link rel="stylesheet" href="themes/children-fun.css">
  <link rel="stylesheet" href="styles/mobile-layout.css">
  <link rel="stylesheet" href="styles/float-controls.css">
  <link rel="stylesheet" href="styles/fab-overlay.css">
  <link rel="stylesheet" href="styles/portrait-mode.css">
</head>
<body>

<!-- ============================================================ -->
<!-- Header                                                        -->
<!-- ============================================================ -->
<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-name">🎹 MyKey Music Labs</span>
      <span class="brand-tagline">Sight Playing Education</span>
    </div>
    <div class="header-right">
      <span class="header-label">Song:</span>
      <select id="songSelect"></select>
      <button id="btnFloatToggle" class="fc-toggle-btn" title="Toggle floating controls">⊡ Float</button>
      <a href="authoring.html" id="authoringLink" title="Segment Authoring Tool">✏ Author</a>
      <a href="library-manager.html" id="libraryManagerLink" title="Library Manager Tool">📚 Library</a>
    </div>
  </div>
</header>

<!-- ============================================================ -->
<!-- App body                                                      -->
<!-- ============================================================ -->
<div class="app-body">

  <!-- Song meta -->
  <div class="song-meta">
    <span id="songTitle">Loading…</span>
    <span class="meta-chip" id="metaBpm">— BPM</span>
    <span class="meta-chip" id="metaTimeSig">—/—</span>
    <span class="meta-chip" id="metaKey">key —</span>
    <span class="meta-chip" id="metaBars">— bars</span>
    <span class="meta-chip" id="metaLevel">—</span>
  </div>

  <!-- Stage strip — compact -->
  <div class="stage-strip">
    <div class="stage-badge">
      <div class="stage-dot"></div>
      <span class="stage-name">Stage 1 — Explore</span>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap" id="progressWrap">
    <div id="progressFill"></div>
  </div>

  <!-- Controls — 2-row compact layout -->
  <div class="controls">

    <!-- Row 1: Primary actions + loop controls -->
    <div class="action-row">
      <button class="btn-primary" id="btnMain">▶ Start Explore</button>
      <button class="btn-reset" id="btnReset" disabled>⏹ Reset</button>
      <span class="tempo-label">Tempo</span>
      <select id="tempoSelect" title="Tempo">
        <option value="0.5000">🐌 Easy</option>
        <option value="0.6250">🐢 Grave</option>
        <option value="1.0000" selected>🚶 Andante</option>
        <option value="1.3889">🚴 Moderato</option>
      </select>

      <!-- HAND filter — hidden for single-clef songs -->
      <div class="control-group group-hand" id="learningRow" style="display:none">
        <span class="group-label group-label-hand">Hand</span>
        <select id="handSelect">
          <option value="both">Both</option>
          <option value="treble">RH</option>
          <option value="bass">LH</option>
        </select>
      </div>

      <span class="action-note" id="actionNote"></span>

      <!-- PRACTICE PART — segments bar, shown only when song has segments -->
      <div class="segments-bar control-group group-practice" id="segmentsBar" style="display:none"></div>

      <!-- Loop controls (promoted to production UI) -->
      <div class="loop-controls">
        <span class="loop-label">Practice Part</span>
        <button class="loop-btn" id="btnDevLoopSelect">☞ Select Loop</button>
        <button class="loop-btn" id="btnDevLoopRepeat" disabled>↺ Repeat</button>
        <button class="loop-btn" id="btnDevLoopClear" disabled>✕ Clear</button>
        <span class="loop-status" id="devLoopStatus">no loop</span>
      </div>

      <!-- Scroll mode A/B toggle — developer testing only -->
      <div class="loop-controls" id="scrollModeControls">
        <span class="loop-label">Scroll</span>
        <button class="loop-btn" id="btnScrollBurst">Burst</button>
        <button class="loop-btn" id="btnScrollFlowing">Flow</button>
        <button class="loop-btn nk-scroll-active" id="btnScrollHybrid">Hybrid</button>
      </div>

      <button class="btn-skip" id="btnSkip">Skip → Stage 2</button>
      <!-- Dev preset — hidden, kept for JS binding -->
      <button id="btnDevLoop1" style="display:none" aria-hidden="true">Bars 5–6</button>
    </div>

  </div>

  <!-- Score card — viewport layer wraps renderer output -->
  <div class="score-card has-viewport">
    <div id="notation-viewport">
      <div id="notation-camera">
        <div id="score">
          <div class="score-loading">Loading notation…</div>
        </div>
      </div>
    </div>
    <!-- Viewport controls overlay — zoom, fit-width, fullscreen -->
    <div class="viewport-controls" id="vpControls">
      <button class="vp-btn vp-active" id="btnVpFitWidth" title="Fit Width">↔</button>
      <div class="vp-sep"></div>
      <button class="vp-btn" id="btnVpZoomOut" title="Zoom Out">−</button>
      <span class="vp-scale-label" id="vpScaleLabel">100%</span>
      <button class="vp-btn" id="btnVpZoomIn" title="Zoom In">+</button>
      <div class="vp-sep"></div>
      <button class="vp-btn" id="btnVpReset" title="Reset Zoom">1×</button>
      <button class="vp-btn" id="btnVpFullscreen" title="Fullscreen">⛶</button>
    </div>
  </div>

  <!-- Status bar — compact playback info -->
  <div class="status-bar">
    <span class="status-item">
      <span class="status-lbl">Bar</span>
      <span class="status-val" id="statusBarNum">—</span>
    </span>
    <span class="status-sep">·</span>
    <span class="status-item">
      <span class="status-lbl">Time</span>
      <span class="status-val" id="timeDisplay">0:00 / 0:00</span>
    </span>
    <span class="seg-mode-badge" id="segModeBadge" style="margin-left:4px;"></span>
  </div>

  <!-- Keyboard visualization -->
  <div class="kb-wrap">
    <div class="kb-header">
      <span class="kb-header-label">Piano</span>
      <span class="kb-notename">
        <select id="noteNameMode">
          <option value="letter">Letter (C D E)</option>
          <option value="solfege">Solfège (Do Re Mi)</option>
          <option value="number">Numbers (1 2 3)</option>
        </select>
      </span>
    </div>
    <div id="keyboardEl"></div>
  </div>


</div>

<!-- ============================================================ -->
<!-- FAB Overlay — experimental true floating controls           -->
<!-- Visible only in body.nk-fab-mode. Zero layout footprint.  -->
<!-- ============================================================ -->
<div id="fabOverlay" class="fab-overlay" aria-hidden="true">

  <!-- Thin progress strip at viewport top -->
  <div class="fab-progress" id="fabProgressWrap">
    <div class="fab-progress-fill" id="fabProgressFill"></div>
  </div>

  <!-- Song picker panel (shown/hidden by song button) -->
  <div class="fab-song-panel" id="fabSongPanel" aria-hidden="true">
    <div class="fab-song-panel-header">
      <span class="fab-song-panel-title">Select Song</span>
      <button class="fab-btn fab-close-btn" id="fabSongClose" title="Close">×</button>
    </div>
    <div class="fab-song-list" id="fabSongList"></div>
  </div>

  <!-- Hand panel (shown/hidden by Hand button) -->
  <div class="fab-tools-panel" id="fabHandPanel" aria-hidden="true">
    <div class="fab-tools-section" id="fabHandSection">
      <span class="fab-tools-label">Hand</span>
      <div class="fab-tools-hand-group">
        <button class="fab-tools-hand-btn" data-clef="both">Both</button>
        <button class="fab-tools-hand-btn" data-clef="treble">RH</button>
        <button class="fab-tools-hand-btn" data-clef="bass">LH</button>
      </div>
    </div>
  </div>

  <!-- Segment panel (shown/hidden by Segment button) -->
  <div class="fab-tools-panel" id="fabToolsPanel" aria-hidden="true">
    <div class="fab-tools-section" id="fabPartSection" style="display:none">
      <span class="fab-tools-label">Part</span>
      <select id="fabPartSelect" class="fab-tools-select"></select>
    </div>
  </div>

  <!-- Note guidance strip — all FAB modes.
       Pinned to top (below 3px progress strip).
       Row 1: song title (center). Row 2: LH notes left, RH notes right. -->
  <div class="fab-ngr" id="fabNgr" aria-live="polite" aria-label="Current notes">
    <div class="ngr-title-row">
      <span class="ngr-song-title" id="fabNgrTitle">—</span>
      <span class="ngr-meta" id="fabNgrMeta">
        <span class="ngr-meta-lbl">Part</span>&thinsp;:&thinsp;<span class="ngr-meta-val ngr-meta-clickable" id="ngrMetaPart">—</span>
        <span class="ngr-meta-div"></span>
        <span class="ngr-meta-lbl">Bar</span>&thinsp;:&thinsp;<span class="ngr-meta-val ngr-meta-clickable" id="ngrMetaBar">—</span><input type="number" id="ngrBarInput" class="ngr-bar-input">
      </span>
    </div>
    <div class="ngr-notes-row">
      <div class="ngr-half ngr-lh">
        <span class="ngr-icon-group">
          <span class="ngr-clef-glyph">&#xE062;</span><span class="ngr-hand">✋</span>
        </span>
        <span class="ngr-notes" id="ngrLH">—</span>
      </div>
      <div class="ngr-div"></div>
      <div class="ngr-half ngr-rh">
        <span class="ngr-notes" id="ngrRH">—</span>
        <span class="ngr-icon-group">
          <span class="ngr-hand ngr-hand-flip">✋</span><span class="ngr-clef-glyph">&#xE050;</span>
        </span>
      </div>
    </div>
  </div>

  <!-- Tempo picker panel -->
  <div class="fab-pick-panel" id="fabTempoPick" aria-hidden="true">
    <button class="fab-pick-item" data-val="0.5000">🐌 Easy</button>
    <button class="fab-pick-item" data-val="0.6250">🐢 Grave</button>
    <button class="fab-pick-item" data-val="1.0000">🚶 Normal</button>
    <button class="fab-pick-item" data-val="1.3889">🚴 Fast</button>
  </div>

  <!-- Note mode picker panel -->
  <div class="fab-pick-panel" id="fabNoteModePick" aria-hidden="true">
    <button class="fab-pick-item" data-mode="letter">ABC</button>
    <button class="fab-pick-item" data-mode="solfege">Do Re Mi</button>
    <button class="fab-pick-item" data-mode="number">1 2 3</button>
  </div>

  <!-- Part picker for NGR landscape title strip — populated dynamically -->
  <div class="fab-pick-panel" id="fabNgrPartPick" aria-hidden="true"></div>

  <!-- Portrait info row — current phrase (Part) and bar number (Bar).
       Shown only in portrait FAB mode via portrait-mode.css. -->
  <div class="fab-info-row" id="fabInfoRow">
    <span><span class="fab-info-lbl">Part</span> : <span id="fabInfoPart">—</span></span>
    <span><span class="fab-info-lbl">Bar</span> : <span id="fabInfoBar">—</span></span>
  </div>

  <!-- Compact floating controls pill above keyboard -->
  <div class="fab-bar" id="fabBar">
    <span class="fab-drag-handle" id="fabDragHandle" title="Drag to reposition" aria-hidden="true">⠿</span>
    <div class="fab-bar-left">
      <button class="fab-btn fab-practice-btn" id="fabPracticeBtn" title="Practice">⚑</button>
      <button class="fab-btn fab-song-btn" id="fabSongBtn" title="Select Song">♪</button>
      <button class="fab-btn fab-tools-btn" id="fabToolsBtn" title="Segment">≡</button>
    </div>
    <button class="fab-btn fab-main-btn" id="fabBtnMain" title="Play">▶</button>
    <div class="fab-bar-right">
      <button class="fab-btn fab-tempo-btn" id="fabTempoBtn" title="Tempo">🏃</button>
      <button class="fab-btn fab-notemode-btn" id="fabNoteModeBtn" title="Note name">&#x1F3B5;</button>
      <button class="fab-btn fab-hand-btn" id="fabHandBtn" title="Hand">✋</button>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Scripts                                                       -->
<!-- Load order: VexFlow UMD (sets window.VexFlow) → Vex bridge   -->
<!-- → runtime-engine → notation-renderer → app code              -->
<!-- ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js"></script>
<script>window.Vex = { Flow: window.VexFlow }; window.VexFlow.setMusicFont('Bravura', 'Gonville');</script>
<script src="src/runtime-engine.js"></script>
<script src="src/notation-renderer.js"></script>
<script src="src/viewport-manager.js"></script>
<script src="src/landscape-coordinator.js"></script>
<script src="src/reading-window.js"></script>
<script src="src/count-in.js"></script>
<script src="src/learning-state.js"></script>
<script src="src/keyboard-viz.js"></script>
<script src="src/song-loader.js"></script>
<script src="src/practice-loop.js"></script>
<script>
'use strict';

// -----------------------------------------------------------------------
// Experimental: true floating overlay (FAB) mode — notation-first.
// Set to false to revert to normal flow-based layout.
// #btnFloatToggle in the header also toggles at runtime.
// -----------------------------------------------------------------------
const FAB_CONTROLS = true;
if (FAB_CONTROLS) document.body.classList.add('nk-fab-mode');

// Previous float-controls experiment (repositioned in flow) — disabled.
const FLOAT_CONTROLS = false;
if (FLOAT_CONTROLS) document.body.classList.add('nk-float-controls');

// -----------------------------------------------------------------------
// Portrait mode detection — JS-driven, more reliable than CSS orientation query.
// Adds body.nk-portrait when height > width. CSS rules key off this class.
// Rollback: delete this block + portrait-mode.css rules that use body.nk-portrait.
// -----------------------------------------------------------------------
function _portraitBarsPerRow() {
  const vp = document.getElementById('notation-viewport');
  // EXPERIMENT Very Large Notation: 1 bar/row on phones, 2 on wider portrait
  return (vp && vp.clientWidth < 480) ? 1 : 2;
}

let _lastEventOfBar = new Map();  // bar number → t_ms of last event (for lookahead scroll)
let _barDuration    = new Map();  // bar number → musical duration ms at native tempo
let _scrollMode     = 'hybrid';   // 'burst' | 'flowing' | 'hybrid' — A/B test toggle
let _landscapeFabReady  = false;  // set true after engine instances are initialized
let _landscapeFabActive = false;  // true when landscape FAB mode is currently active

// Landscape FAB bar auto-hide during playback
let _fabBarHideTimer = null;
function _fabBarShow() {
  clearTimeout(_fabBarHideTimer); _fabBarHideTimer = null;
  document.body.classList.remove('nk-fab-bar-hidden');
}
function _fabBarHide() {
  clearTimeout(_fabBarHideTimer); _fabBarHideTimer = null;
  document.body.classList.add('nk-fab-bar-hidden');
}
function _fabBarScheduleHide(ms) {
  clearTimeout(_fabBarHideTimer);
  _fabBarHideTimer = setTimeout(() => { if (uiState === 'playing') _fabBarHide(); }, ms);
}

function _syncPortrait() {
  const isPortrait = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('nk-portrait', isPortrait);
  const root = document.documentElement;
  root.style.setProperty('--fab-bar-h', isPortrait ? '54px' : '');  // '' reverts to CSS default
  _syncLandscapeFab();
}
_syncPortrait();
window.addEventListener('resize',            _syncPortrait, { passive: true });
window.addEventListener('orientationchange', () => setTimeout(_syncPortrait, 80), { passive: true });

// Note guidance row — portrait reading mode. Stub replaced by _initNoteGuidanceRow().
// Rollback: set to () => {} and delete the IIFE + HTML element + portrait-mode.css.
let _ngrUpdate = () => {};

// --- DIAG: NGR strip diagnostics — remove when root cause identified ---
let   _diagTime           = 0;         // ms — updated every timeline tick
const _diagRendererActive = new Map(); // id → { notes, clef } — mirrors renderer highlights
const _diagEnterTime      = new Map(); // id → t_ms — playback time when event entered renderer
// --- /DIAG ---

// -----------------------------------------------------------------------
// Engine instances — created once (SPEC §3.3: one engine, one responsibility)
// -----------------------------------------------------------------------
const runtime       = new RuntimeEngine();
const renderer      = new NotationRenderer();
const learningState = new LearningModeState();
const keyboardViz   = new KeyboardViz();

// ViewportManager — presentation layer only. Isolated from runtime + renderer internals.
// Manages zoom, pan, fullscreen, orientation for the notation viewport.
const viewportManager = new ViewportManager();
viewportManager
  .init(
    document.getElementById('notation-viewport'),
    document.getElementById('notation-camera')
  )
  .onFullscreenChange(_vpSyncFullscreenBtn);

// LandscapeViewportCoordinator — manages orientation classes and rotation transition guard.
// Additive layer: no coupling to renderer or runtime.
const landscapeCoordinator = new LandscapeViewportCoordinator();
landscapeCoordinator.init({
  scoreCardEl: document.querySelector('.score-card'),
  cameraEl:    document.getElementById('notation-camera'),
  viewportManager,
});

// ContextAwareReadingWindow — calmer, anticipatory scroll behavior during playback.
// Replaces renderer.scrollToBar() in the onEventEnter handler only.
// Jump-to scrolls (segment nav, loop nav) still use renderer.scrollToBar().
const readingWindow = new ContextAwareReadingWindow();
readingWindow.init(document.getElementById('notation-viewport'));
readingWindow.setViewportManager(viewportManager);  // enables orientation-reset on reframe

const countIn = new CountIn();
countIn.init(document.getElementById('score'));

// Composite scale callback — UI label + zoom-aware reading window update.
// Wired here (after readingWindow init) so both consumers are available.
// readingWindow.setViewportScale() adjusts effective dead zone and reading
// position at higher zoom levels for earlier, calmer reframing (Task 2B).
viewportManager.onScaleChange(s => {
  _vpUpdateScaleLabel(s);
  readingWindow.setViewportScale(s);
});

// Practice loop — runtime-only, session-scoped. Completely separate from
// learning_segments (authored curriculum). See src/practice-loop.js.
const practiceLoop  = new PracticeLoop();

// Loop selection interaction state — interaction layer only, no semantic authority.
// mode: 'off' | 'selecting'   startId: event ID of first clicked note (or null)
const _loopSelect = { mode: 'off', startId: null };

// Attach keyboard visualization — builds initial DOM.
keyboardViz.render(document.getElementById('keyboardEl'));
_landscapeFabReady = true;
// Deferred: all let/const declarations must be initialized before _syncLandscapeFab runs.
// setTimeout(0) pushes call to next macrotask — after synchronous script finishes.
setTimeout(() => _syncLandscapeFab(true), 0);

// -----------------------------------------------------------------------
// UI state
// -----------------------------------------------------------------------
let currentSong        = null;   // loaded song.json object
let currentTempoScale  = 1.0;   // active multiplier (recomputed on song load)
let uiState            = 'idle'; // 'idle' | 'playing' | 'paused' | 'ended'
let lastBar            = -1;    // for scroll-to-bar on bar change
let activeSegmentIndex = -1;    // -1 = no segment active; ≥0 = index in resolvedSegments
let _barDynamicsMap    = {};    // bar number → dynamics string, rebuilt on song load
let _slurActive        = {};    // clef → bool, tracks whether we are inside a slur phrase

// -----------------------------------------------------------------------
// DOM refs
// -----------------------------------------------------------------------
const btnMain      = document.getElementById('btnMain');
const btnReset     = document.getElementById('btnReset');
const btnSkip      = document.getElementById('btnSkip');
const progressFill = document.getElementById('progressFill');
const progressWrap = document.getElementById('progressWrap');
const timeDisplay  = document.getElementById('timeDisplay');
const actionNote   = document.getElementById('actionNote');
const scoreEl       = document.getElementById('score');
const songSelect    = document.getElementById('songSelect');
const segmentsBar   = document.getElementById('segmentsBar');
const segModeBadge  = document.getElementById('segModeBadge');
const learningRow   = document.getElementById('learningRow');

// -----------------------------------------------------------------------
// Song loader — fetch, engine init, meta display, parts bar
// -----------------------------------------------------------------------
// --- DIAG: NGR lifecycle log — remove when root cause confirmed ---
function _diagNgrLog(label) {
  if (!window._ngrDiag) return;
  const s = window._ngrDiag.snapshot();
  console.log(
    `[NGR ${label}]` +
    `  treble=${s.treble}` +
    `  bass=${s.bass}` +
    `  enter/exit=${s.enterCount}/${s.exitCount}  imbalance=${s.imbalance}`
  );
  if (s.trebleSize > 0 || s.bassSize > 0) {
    console.warn(
      `[NGR ⚠ LEAK @ ${label}]` +
      `  ${s.trebleSize} treble + ${s.bassSize} bass events still in active map` +
      `  — these will pollute the next song`
    );
  }
}
// --- /DIAG ---

const songLoader = new SongLoader({
  runtime, renderer, learningState, keyboardViz,
  elements: {
    scoreEl,
    songTitle:   document.getElementById('songTitle'),
    metaBpm:     document.getElementById('metaBpm'),
    metaTimeSig: document.getElementById('metaTimeSig'),
    metaKey:     document.getElementById('metaKey'),
    metaBars:    document.getElementById('metaBars'),
    metaLevel:   document.getElementById('metaLevel'),
  },
  onBeforeLoad() {
    _diagNgrLog('BEFORE-LOAD'); // DIAG — snapshot BEFORE runtime.stop() clears engine
    _setUIState('idle');
    actionNote.textContent = '';
    lastBar = -1;
    _lastEventOfBar = new Map();
    _barDuration    = new Map();
    practiceLoop.deactivate();
    _loopSelect.mode = 'off';
    _loopSelect.startId = null;
    scoreEl?.closest?.('.score-card')?.classList.remove('loop-selecting');
    _syncDevLoopPanel();
  },
  onSuccess(data) {
    _diagNgrLog('AFTER-LOAD'); // DIAG — snapshot AFTER new song loaded; should show ∅ if clean
    if (window._ngrDiag) { window._ngrDiag.enterCount = 0; window._ngrDiag.exitCount = 0; } // DIAG reset
    currentSong = data;
    _barDynamicsMap = {};
    _slurActive     = {};
    _lastEventOfBar = new Map();
    _barDuration    = new Map();
    for (const bar of (data.score?.bars || [])) {
      if (bar.beats?.length) {
        _lastEventOfBar.set(bar.bar, Math.max(...bar.beats.map(e => e.t_ms)));
      }
    }
    // Build bar duration map: duration of bar N = first-beat(N+1) - first-beat(N)
    {
      const firstBeat = new Map();
      for (const bar of (data.score?.bars || [])) {
        if (bar.beats?.length) {
          firstBeat.set(bar.bar, Math.min(...bar.beats.map(e => e.t_ms)));
        }
      }
      const sorted = [...firstBeat.entries()].sort((a, b) => a[0] - b[0]);
      for (let i = 0; i < sorted.length - 1; i++) {
        _barDuration.set(sorted[i][0], sorted[i + 1][1] - sorted[i][1]);
      }
      // Last bar: fall back to its own beat span + one beat estimate
      if (sorted.length > 0) {
        const lastBarN = sorted[sorted.length - 1][0];
        const lastBarBeats = (data.score?.bars || []).find(b => b.bar === lastBarN)?.beats || [];
        if (lastBarBeats.length) {
          const span = Math.max(...lastBarBeats.map(e => e.t_ms)) - firstBeat.get(lastBarN);
          _barDuration.set(lastBarN, span + 1000);
        }
      }
    }
    (data.score?.bars || []).forEach(b => { if (b.dynamics) _barDynamicsMap[b.bar] = b.dynamics; });
    // Pre-compute tied_total_ms for each tie_start event so _playNote sustains
    // through the full tie chain. tied_total_ms = chain-end's (t_ms+duration_ms) - start's t_ms.
    {
      const allBeats = [];
      for (const bar of (data.score?.bars || [])) {
        for (const ev of (bar.beats || [])) allBeats.push(ev);
      }
      // Pass 1: match each tie_start to its immediate tie_stop.
      const tieNext = new Map(); // srcId → dstEv
      const pend    = new Map(); // "clef:sortedNotes" → pending tie_start ev
      for (const ev of allBeats) {
        if (!ev.notes?.length || ev.type === 'rest') continue;
        const k = `${ev.clef}:${[...ev.notes].sort().join(',')}`;
        if (ev.tie_stop && pend.has(k)) { tieNext.set(pend.get(k).id, ev); pend.delete(k); }
        for (const [pk] of [...pend.entries()]) { if (pk.startsWith(ev.clef + ':')) pend.delete(pk); }
        if (ev.tie_start) pend.set(k, ev);
      }
      // Pass 2: follow each chain-start to its chain-end and store total duration.
      for (const ev of allBeats) {
        if (!ev.tie_start || ev.tie_stop) continue;
        let last = ev;
        while (tieNext.has(last.id)) last = tieNext.get(last.id);
        if (last !== ev) ev.tied_total_ms = last.t_ms + last.duration_ms - ev.t_ms;
      }
    }
    _syncLearningControls();
    _updateProgress(0);
    _updateTime(0);
    _refreshBarTicks();
    activeSegmentIndex = -1;
    _rebuildSegmentsBar(songLoader.resolvedSegments);
    _syncSegmentsBar();
    _updateStatusBarNum(-1);
    _applyNoteNameMode();
    // Re-apply viewport mode: landscape FAB re-renders with barsPerRow:'all';
    // otherwise defers to existing fitWidth / current zoom state.
    _syncLandscapeFab(true);
    _vpUpdateScaleLabel(viewportManager.scale);
  },
  onTempoScaleUpdate(scale) { currentTempoScale = scale; },
  getRenderOpts() {
    return { barsPerRow: _landscapeFabActive ? 'all' : _portraitBarsPerRow() };
  },
});

// -----------------------------------------------------------------------
// Explore Audio — minimal piano synth, Web Audio API
// TEMP_MVP: replaced by example_audio MP3 when audio files available
// -----------------------------------------------------------------------
const _audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function _audioResume() {
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
}

// Audio schedule anchor — maps a song t_ms to an absolute AudioContext time.
// Set right after every runtime.play() call so each note's audio is scheduled
// at the correct offset from the playback origin, even when the first RAF tick
// fires late and multiple events land in the same engine tick.
let _playbackAudioOrigin = null; // { ctxTime, songMs, tempoScale }

function _audioScheduleAt(songTime_ms) {
  if (!_playbackAudioOrigin) return _audioCtx.currentTime + 0.008;
  const elapsedMs  = (songTime_ms - _playbackAudioOrigin.songMs) / _playbackAudioOrigin.tempoScale;
  const targetCtx  = _playbackAudioOrigin.ctxTime + elapsedMs / 1000;
  // Never schedule in the past; 3ms minimum lookahead keeps the audio engine happy
  return Math.max(_audioCtx.currentTime + 0.003, targetCtx);
}

function _noteToHz(name) {
  const m = name.match(/^([A-G])(#{1,2}|b{1,2})?(\d+)$/);
  if (!m) return null;
  const steps = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  let semi = steps[m[1]];
  const acc = m[2] || '';
  if      (acc === '#')  semi += 1;
  else if (acc === '##') semi += 2;
  else if (acc === 'b')  semi -= 1;
  else if (acc === 'bb') semi -= 2;
  const midi = (parseInt(m[3]) + 1) * 12 + semi; // C4 = MIDI 60
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// Dynamic level → peak gain. mf (0.30) matches the previous hardcoded value so
// songs without dynamics fields are unchanged. Range is intentionally compressed
// (0.20–0.38) to keep pp audible and ff safe on all output devices.
const _DYNAMIC_VOL = { pp: 0.20, p: 0.24, mp: 0.27, mf: 0.30, f: 0.34, ff: 0.38 };

// writtenDurationMs — the notated rhythmic value from song.json (duration_ms).
//   Drives the timeline beat grid, highlight windows, and score layout.
//   Must never change: altering it would shift the beat grid under the player.
//
// performedDurationMs — the audible sustain sent to the audio envelope.
//   Scaled by tempoScale so audio fills the actual wall-clock note duration.
//   Staccato: ~50% of wall-clock duration. Normal: full wall-clock duration.
function _playNote(noteNames, writtenDurationMs, articulations, dynamic, tempoScale, isLegato = false, isSlurEnd = false, scheduleAt) {
  if (!noteNames || !noteNames.length) return;
  const now = scheduleAt ?? (_audioCtx.currentTime + 0.008);

  const scale = tempoScale > 0 ? tempoScale : 1.0;
  const isStaccato = Array.isArray(articulations) && articulations.includes('staccato');
  const isAccent   = Array.isArray(articulations) && articulations.includes('accent');
  const wallClockMs = writtenDurationMs / scale;
  const performedDurationMs = isStaccato ? wallClockMs * 0.5 : wallClockMs;
  const dur = Math.max(0.05, performedDurationMs / 1000);

  const baseVol = (_DYNAMIC_VOL[dynamic] ?? 0.30) * (isAccent ? 1.35 : 1.0);
  const vol = baseVol / Math.sqrt(noteNames.length); // chord compensation

  noteNames.forEach(name => {
    const freq = _noteToHz(name);
    if (!freq) return;

    const osc  = _audioCtx.createOscillator();
    const gain = _audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(_audioCtx.destination);

    if (isStaccato) {
      // Sharp cutoff at performed duration — audibly detached.
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur + 0.06);
      osc.start(now);
      osc.stop(now + dur + 0.08);
    } else if (isLegato && !isSlurEnd) {
      // Legato mid-slur: soft attack + sustain bridging to next note.
      gain.gain.setValueAtTime(vol * 0.45, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(vol * 0.65, now + dur);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur + 0.05);
      osc.start(now);
      osc.stop(now + dur + 0.08);
    } else if (isLegato && isSlurEnd) {
      // Slur-end: soft attack + 3-segment duration-scaled envelope.
      // Segment 1 (transient): vol → vol*0.6 in 80ms — initial brightness
      // Segment 2 (sustain):   vol*0.6 → vol*0.35 over 85% of note — stays audible throughout
      // Segment 3 (release):   vol*0.35 → ~0 in 200ms — phrase boundary
      gain.gain.setValueAtTime(vol * 0.45, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(vol * 0.6, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(vol * 0.35, now + dur * 0.85);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur + 0.2);
      osc.start(now);
      osc.stop(now + dur + 0.3);
    } else {
      // Normal piano-like envelope: duration-scaled 3-segment decay.
      // Segment 1 (transient): vol → vol*0.6 in 80ms — bright attack
      // Segment 2 (sustain):   vol*0.6 → vol*0.3 over 85% of note — stays audible
      // Segment 3 (release):   vol*0.3 → ~0 in 400ms — natural piano tail
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(vol * 0.6, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(vol * 0.3, now + dur * 0.85);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur + 0.4);
      osc.start(now);
      osc.stop(now + dur + 0.5);
    }
  });
}

// -----------------------------------------------------------------------
// Runtime → Interaction adapter → Renderer wiring
// (ui-shell orchestration pattern, SPEC §3.4 + runtime-contract.md §11)
//
// Ownership layers (top → bottom):
//   LearningModeState  — decides highlight style and audio gate (presentation)
//   NotationRenderer   — applies SVG CSS class (visual only, no semantic authority)
//   RuntimeEngine      — fires events at correct t_ms (timing authority, untouched)
//
// Layer 3 semantic contracts are frozen — do NOT add articulation, tie, slur,
// or duration logic here. Those live in the renderer and learning-state only.
// -----------------------------------------------------------------------
runtime
  .onEventEnter(ev => {
    // 1. Bar scroll — always, regardless of clef filter (SPEC §5.4)
    //    CONTRACT: onEventEnter fires BEFORE onEventExit within the same tick
    //    (runtime-contract.md §4.5). This means at a bar boundary, the new bar's
    //    first note ENTERS before the old bar's last note EXITS. Scroll is triggered
    //    here (on enter) so it fires at the correct bar, not the departing bar.
    //    If this ordering ever changed, the scroll would jump to the wrong bar.
    if (ev.bar !== lastBar) {
      lastBar = ev.bar;
      _updateStatusBarNum(ev.bar);
      if (_scrollMode === 'flowing') {
        const rawDur = _barDuration.get(ev.bar) ?? 2000;
        readingWindow.scrollToBarFlowing(ev.bar, rawDur / currentTempoScale, scoreEl);
      }
    }
    // Lookahead at last event of bar N — fires early enough for sight-reading preview.
    // Hybrid: scroll to bar N+1 while bar N is still playing its final note (~500–2000ms
    //         before bar N+1 starts), giving the user time to read ahead.
    // Burst:  same timing, instant snap via scrollToBar.
    if (_lastEventOfBar.size && ev.t_ms === _lastEventOfBar.get(ev.bar)) {
      if (_scrollMode === 'burst')  readingWindow.scrollToBar(ev.bar + 1, scoreEl);
      if (_scrollMode === 'hybrid') readingWindow.scrollToBarHybrid(ev.bar + 1, scoreEl);
    }

    // 2. SVG highlight — only for clefs active in current learning filter.
    //    Inactive-clef events are not highlighted (no dim/ghost — clean visual focus).
    //    renderer.render() always shows all notes regardless of this filter.
    if (learningState.isClefActive(ev.clef)) {
      renderer.highlight(ev.id, learningState.getHighlightStyle(ev));
      // --- DIAG ---
      _diagRendererActive.set(ev.id, { notes: ev.notes || [], clef: ev.clef });
      _diagEnterTime.set(ev.id, _diagTime);
      // --- /DIAG ---
    }

    // 3. Audio — learning state decides (rest / tie_stop / filtered clef → silent).
    //    Articulation + tie semantics are preserved inside _playNote and learningState.
    if (learningState.shouldPlayAudio(ev)) {
      if (ev.slur_start) _slurActive[ev.clef] = true;
      const isLegato   = !!_slurActive[ev.clef];
      const isSlurEnd  = !!ev.slur_stop;
      _playNote(ev.notes, ev.tied_total_ms ?? ev.duration_ms, ev.articulations, _barDynamicsMap[ev.bar], currentTempoScale, isLegato, isSlurEnd, _audioScheduleAt(ev.t_ms));
      if (ev.slur_stop) _slurActive[ev.clef] = false;
    }

    // 4. Keyboard highlight state — hook for future visual piano keyboard.
    //    learningState updates _keyboardState and fires onKeyHighlight callback.
    learningState.notifyEventEnter(ev);
    // --- DIAG ---
    console.log(
      `[NGR ENTER] t=${Math.round(_diagTime)}ms` +
      `  id=${ev.id}  clef=${ev.clef}  notes=[${(ev.notes||[]).join(',')}]` +
      `  tie_stop=${!!ev.tie_stop}  dur=${ev.duration_ms}ms` +
      `  rendered=${_diagRendererActive.has(ev.id)}`
    );
    // --- /DIAG ---
  })
  .onEventExit(ev => {
    // clearHighlight is always called; no-op if event was never highlighted.
    renderer.clearHighlight(ev.id);
    // --- DIAG ---
    _diagRendererActive.delete(ev.id);
    const _diagTEnter = _diagEnterTime.get(ev.id) ?? '?';
    _diagEnterTime.delete(ev.id);
    // --- /DIAG ---
    // Sync keyboard state for future keyboard component.
    learningState.notifyEventExit(ev);
    // --- DIAG ---
    console.log(
      `[NGR EXIT]  t=${Math.round(_diagTime)}ms` +
      `  id=${ev.id}  clef=${ev.clef}  notes=[${(ev.notes||[]).join(',')}]` +
      `  entered@${Math.round(_diagTEnter)}ms`
    );
    // --- /DIAG ---
  })
  .onTimelineUpdate(t => {
    _diagTime = t; // DIAG
    _updateProgress(t);
    _updateTime(t);
  })
  .onEnd(() => {
    renderer.clearAll();  // scope ended — clear all remaining highlights
    keyboardViz.clear();
    _diagNgrLog('PLAYBACK-END'); // DIAG — imbalance here = events that never got an exit
    // Auto-repeat: loop scope restarts after a brief pause so the boundary is perceptible.
    // Does NOT affect learning_segments — repeat_enabled is loop-scoped state only.
    if (practiceLoop.active && practiceLoop.repeat_enabled) {
      lastBar = -1;
      _updateProgress(0);
      _updateTime(0);
      setTimeout(() => {
        if (!practiceLoop.active || !practiceLoop.repeat_enabled) { _setUIState('ended'); return; }
        runtime.stop();
        runtime.play({ start_ms: practiceLoop.start_ms, end_ms: practiceLoop.end_ms, tempoScale: currentTempoScale });
        _playbackAudioOrigin = { ctxTime: _audioCtx.currentTime + 0.025, songMs: runtime.scopeStart, tempoScale: currentTempoScale };
        if (practiceLoop.start_bar != null) renderer.scrollToBar(practiceLoop.start_bar);
        _setUIState('playing');
      }, 350);
    } else {
      _setUIState('ended');
    }
  });

// -----------------------------------------------------------------------
// Learning state wiring
// -----------------------------------------------------------------------

// Sync learning controls UI to current learningState.
// Called on song load and whenever learningState fires onChange.
function _syncLearningControls() {
  // Always show the hand-filter row after a song loads
  learningRow.style.display = '';

  document.getElementById('handSelect').value = learningState.clefFilter;
}

// Fire _syncLearningControls whenever learningState changes (e.g. setClefFilter)
learningState.onChange(() => _syncLearningControls());

// Keyboard highlight hook — forward typed events to KeyboardViz presentation layer.
// kh = { type: 'enter'|'exit'|'clear', notes, clef, color?, eventId? }
learningState.onKeyHighlight(kh => { keyboardViz.onHighlight(kh); _ngrUpdate(kh); });

// Hand-filter dropdown — change event updates the clef filter.
learningRow.addEventListener('change', e => {
  if (e.target.id !== 'handSelect') return;
  learningState.setClefFilter(e.target.value);

  // Re-render with active scope (loop > segment > full song) + new clef filter
  if (currentSong) {
    const seg = activeSegmentIndex >= 0 ? songLoader.resolvedSegments[activeSegmentIndex] : null;
    const clef = e.target.value;
    const visibleClefs = clef === 'both' ? null : [clef];
    // Loop viewport takes priority over segment scope for rendering
    const visibleBars = practiceLoop.active ? practiceLoop.bars : (seg ? seg.bars : null);
    renderer.render(currentSong, scoreEl, { visibleBars, visibleClefs, barsPerRow: _landscapeFabActive ? 'all' : _portraitBarsPerRow() });
    if (_landscapeFabActive) {
      viewportManager.setNaturalWidth(renderer.canvasWidth);
      viewportManager.fitHeight(renderer.rowHeight + 20);
    }
    if (!practiceLoop.active && seg) _applyBeatDim(currentSong, seg);
    const scrollBar = practiceLoop.active ? practiceLoop.start_bar : (seg ? seg.start_bar : null);
    if (scrollBar != null) renderer.scrollToBar(scrollBar);
  }
});

// Score click handler — resolves click → semantic event ID → loop selection.
// Interaction layer only: no timing or semantic-layer authority.
scoreEl.addEventListener('click', e => {
  if (_loopSelect.mode !== 'selecting') return;
  const noteEl = e.target.closest('[data-event-id]');
  if (!noteEl || !currentSong) return;
  const eventId = noteEl.dataset.eventId;

  if (!_loopSelect.startId) {
    // First click — mark start, wait for end click
    _loopSelect.startId = eventId;
    renderer.markLoopBoundary(eventId, 'start');
    _syncDevLoopPanel();
    _showToast('Click end note to complete the loop');
  } else if (eventId !== _loopSelect.startId) {
    // Second click — activate loop from the two event IDs
    const startId = _loopSelect.startId;
    _loopSelect.startId = null;
    _loopSelect.mode = 'off';
    scoreEl.closest('.score-card').classList.remove('loop-selecting');

    try {
      practiceLoop.activateFromEvents(startId, eventId, currentSong);
    } catch (err) {
      _showToast('Loop selection failed: ' + err.message);
      _syncDevLoopPanel();
      return;
    }
    _activatePracticeLoop(null);  // null: loop already activated above
    // Re-add marks after render() rebuilt the DOM (render clears all SVG classes)
    // Marks reflect user's click order; loop plays temporal order regardless
    renderer.markLoopBoundary(startId, 'start');
    renderer.markLoopBoundary(eventId, 'end');
    _syncDevLoopPanel();
    _showToast('Loop set · Press ▶ to play');
  }
});

// Score tap → seek — interaction layer only, no runtime/renderer architecture touched.
// Active only during playing / paused. Loop-select mode takes full priority.
scoreEl.addEventListener('click', ev => {
  if (_loopSelect.mode === 'selecting') return;
  if (!currentSong) return;
  if (uiState !== 'playing' && uiState !== 'paused') return;

  // Path A: tapped a note — resolve via data-event-id
  const noteEl = ev.target.closest('[data-event-id]');
  if (noteEl) {
    const targetId = noteEl.dataset.eventId;
    let songEv = null;
    for (const bar of currentSong.score.bars) {
      songEv = (bar.beats || []).find(e => e.id === targetId);
      if (songEv) break;
    }
    if (!songEv) return;
    runtime.seek(songEv.t_ms);
    if (uiState === 'paused') _showToast('Bar ' + songEv.bar);
    return;
  }

  // Path B: tapped empty area (rest, barline, clef) — resolve via data-bar
  const barEl = ev.target.closest('[data-bar]');
  if (!barEl) return;
  const barN = parseInt(barEl.dataset.bar, 10);
  let first = null;
  for (const bar of currentSong.score.bars) {
    if (bar.bar !== barN) continue;
    first = (bar.beats || []).reduce((min, e) =>
      (!min || e.t_ms < min.t_ms) ? e : min, null);
    break;
  }
  if (!first) return;
  runtime.seek(first.t_ms);
  if (uiState === 'paused') _showToast('Bar ' + barN);
});

// Rebuild the segments bar DOM from the resolved segments array.
// Shows the bar when segments exist; hides it otherwise.
function _rebuildSegmentsBar(segments) {
  segmentsBar.innerHTML = '';
  if (!segments || !segments.length) {
    segmentsBar.style.display = 'none';
    return;
  }
  segmentsBar.style.display = 'flex';

  const lbl = document.createElement('span');
  lbl.className   = 'segment-label-tag';
  lbl.textContent = 'Song Part';
  segmentsBar.appendChild(lbl);

  const sel = document.createElement('select');
  sel.id        = 'segmentSelect';
  sel.className = 'segment-select';

  const allOpt       = document.createElement('option');
  allOpt.value       = '-1';
  allOpt.textContent = 'All';
  sel.appendChild(allOpt);

  segments.forEach((seg, i) => {
    const opt       = document.createElement('option');
    opt.value       = i;
    opt.textContent = seg.label || seg.id || ('Part ' + (i + 1));
    sel.appendChild(opt);
  });

  segmentsBar.appendChild(sel);
}

// Sync segment button states and the segment mode badge.
function _syncSegmentsBar() {
  const segments = songLoader.resolvedSegments;
  const hasSeg   = activeSegmentIndex >= 0;

  const sel = document.getElementById('segmentSelect');
  if (sel) sel.value = String(activeSegmentIndex);

  // Segment mode badge in stage strip
  if (hasSeg) {
    const seg = segments[activeSegmentIndex];
    segModeBadge.textContent = seg.label ? 'Practice: ' + seg.label : '';
    segModeBadge.classList.add('visible');
  } else {
    segModeBadge.textContent = '';
    segModeBadge.classList.remove('visible');
  }

  // Keep idle-state button label in sync (segment change may not go through _setUIState)
  if (uiState === 'idle') {
    const _seg = hasSeg ? segments[activeSegmentIndex] : null;
    btnMain.textContent = _seg ? ('▶ Practice ' + _seg.label) : '▶ Start Explore';
  }
}

// Activate a segment by index. Stops playback, re-renders focused bars, scrolls to start.
function _activateSegment(index) {
  const segments = songLoader.resolvedSegments;
  if (index < 0 || index >= segments.length) return;

  const seg = segments[index];
  activeSegmentIndex = index;

  // Segment and part selection are mutually exclusive scopes
  songLoader.setSelectedPart('');

  // Stop playback cleanly before scope change
  if (uiState === 'playing' || uiState === 'paused') {
    runtime.stop();
    renderer.clearAll();
    keyboardViz.clear();
    lastBar = -1;
    _updateProgress(0);
    _updateTime(0);
    _setUIState('idle');
  }

  // Re-render score to show only this segment's bars, filtered by current clef setting
  if (currentSong) {
    const clef = learningState.clefFilter;
    const visibleClefs = clef === 'both' ? null : [clef];
    renderer.render(currentSong, scoreEl, { visibleBars: seg.bars, visibleClefs, barsPerRow: _portraitBarsPerRow() });
    _applyBeatDim(currentSong, seg);
  }

  // Scroll to segment start bar
  if (seg.start_bar != null) renderer.scrollToBar(seg.start_bar);

  _syncSegmentsBar();
}

// Dim notes outside the active beat range — presentation-layer only, no renderer mutation.
// First bar: dim events before start_beat. Last bar: dim events after end_beat.
function _applyBeatDim(data, seg) {
  if (!data) return;
  const startBeat = seg.start_beat ?? 1;
  const endBeat   = seg.end_beat   ?? 1;

  if (startBeat > 1) {
    const bar = data.score.bars.find(b => b.bar === seg.start_bar);
    if (bar) {
      (bar.beats || []).forEach(ev => {
        if (ev.beat < startBeat) renderer.dimEvent(ev.id);
      });
    }
  }

  if (endBeat > 1) {
    const bar = data.score.bars.find(b => b.bar === seg.end_bar);
    if (bar) {
      (bar.beats || []).forEach(ev => {
        if (ev.beat > endBeat) renderer.dimEvent(ev.id);
      });
    }
  }
}

// Deactivate segment mode — return to full-song state.
function _deactivateSegment() {
  activeSegmentIndex = -1;

  // Re-render full score (all bars, current clef filter still applies)
  if (currentSong) {
    const clef = learningState.clefFilter;
    const visibleClefs = clef === 'both' ? null : [clef];
    renderer.render(currentSong, scoreEl, { visibleClefs, barsPerRow: _portraitBarsPerRow() });  // no visibleBars = all bars
  }

  _syncSegmentsBar();
}

// -----------------------------------------------------------------------
// Practice loop activation — runtime viewport, isolated from learning_segments
// -----------------------------------------------------------------------

// Activate a practice loop viewport. Stops current playback, re-renders to loop bars.
// params: bar-based options passed to practiceLoop.activate(), OR null if the caller
//   has already activated the loop via practiceLoop.activateFromEvents() / .activate().
// Does NOT modify activeSegmentIndex, songLoader.resolvedSegments, or song.json.
function _activatePracticeLoop(params) {
  if (!currentSong) return;
  if (params) practiceLoop.activate(params, currentSong);
  if (!practiceLoop.active) return;

  if (uiState === 'playing' || uiState === 'paused') {
    runtime.stop();
    renderer.clearAll();
    keyboardViz.clear();
    lastBar = -1;
    _updateProgress(0);
    _updateTime(0);
    _setUIState('idle');
  }

  // Respect current clef filter unless loop specifies its own visible_clefs
  const visibleClefs = practiceLoop.visible_clefs
    || (learningState.clefFilter !== 'both' ? [learningState.clefFilter] : null);
  renderer.render(currentSong, scoreEl, { visibleBars: practiceLoop.bars, visibleClefs, barsPerRow: _portraitBarsPerRow() });
  if (practiceLoop.start_bar != null) renderer.scrollToBar(practiceLoop.start_bar);

  _updateProgress(0);
  _updateTime(0);
}

// Deactivate the loop and restore the previous scope (active segment or full song).
// Segment selection is preserved — practiceLoop does not own activeSegmentIndex.
function _deactivatePracticeLoop() {
  if (uiState === 'playing' || uiState === 'paused') {
    runtime.stop();
    renderer.clearAll();
    keyboardViz.clear();
    lastBar = -1;
    _setUIState('idle');
  }

  practiceLoop.deactivate();

  if (!currentSong) return;

  const seg = activeSegmentIndex >= 0 ? songLoader.resolvedSegments[activeSegmentIndex] : null;
  const clef = learningState.clefFilter;
  const visibleClefs = clef === 'both' ? null : [clef];

  if (seg) {
    renderer.render(currentSong, scoreEl, { visibleBars: seg.bars, visibleClefs, barsPerRow: _portraitBarsPerRow() });
    _applyBeatDim(currentSong, seg);
    if (seg.start_bar != null) renderer.scrollToBar(seg.start_bar);
  } else {
    renderer.render(currentSong, scoreEl, { visibleClefs, barsPerRow: _portraitBarsPerRow() });
  }

  _updateProgress(0);
  _updateTime(0);
  _syncSegmentsBar();
}

// Segments dropdown — change event selects or clears the active segment.
segmentsBar.addEventListener('change', e => {
  if (e.target.id !== 'segmentSelect') return;
  const idx = parseInt(e.target.value);
  if (idx < 0) _deactivateSegment();
  else _activateSegment(idx);
});

// -----------------------------------------------------------------------
// Progress + time display
// -----------------------------------------------------------------------
function _updateProgress(t) {
  const start = runtime.scopeStart;
  const end   = runtime.scopeEnd === Infinity ? runtime.duration : runtime.scopeEnd;
  const range = end - start;
  const pct   = range > 0 ? ((t - start) / range) * 100 : 0;
  progressFill.style.width = Math.min(100, Math.max(0, pct)).toFixed(2) + '%';
}

function _updateTime(t) {
  const start = runtime.scopeStart;
  const end   = runtime.scopeEnd === Infinity ? runtime.duration : runtime.scopeEnd;
  const cur   = Math.max(0, t - start);
  const tot   = Math.max(0, end - start);
  const fmt   = ms => {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  timeDisplay.textContent = fmt(cur) + ' / ' + fmt(tot);
}

// Inject bar tick marks into the FAB progress strip.
// Called after song load. Ticks are positioned against full song duration
// so they remain stable regardless of active scope. Pure DOM — no runtime
// or renderer methods called beyond reading runtime.duration.
function _refreshBarTicks() {
  const wrap = document.getElementById('fabProgressWrap');
  if (!wrap || !currentSong) return;
  wrap.querySelectorAll('.fab-bar-tick').forEach(el => el.remove());
  const dur = runtime.duration;
  if (!dur || dur <= 0) return;
  // Build barN → earliest t_ms from score.bars[].beats[]
  const barStarts = new Map();
  for (const bar of currentSong.score.bars) {
    for (const ev of (bar.beats || [])) {
      if (typeof ev.t_ms !== 'number') continue;
      if (!barStarts.has(bar.bar) || ev.t_ms < barStarts.get(bar.bar)) {
        barStarts.set(bar.bar, ev.t_ms);
      }
    }
  }
  barStarts.forEach(t => {
    if (t <= 0) return;  // skip bar 1 at origin — overlaps fill start
    const tick = document.createElement('div');
    tick.className = 'fab-bar-tick';
    tick.style.left = Math.min(100, (t / dur) * 100).toFixed(2) + '%';
    wrap.appendChild(tick);
  });
}

// -----------------------------------------------------------------------
// UI state machine
// -----------------------------------------------------------------------
function _setUIState(state) {
  uiState = state;
  switch (state) {
    case 'idle': {
      const _idleSeg = activeSegmentIndex >= 0 ? songLoader?.resolvedSegments?.[activeSegmentIndex] : null;
      btnMain.textContent = _idleSeg ? ('▶ Practice ' + _idleSeg.label) : '▶ Start Explore';
      btnMain.disabled    = false;
      btnReset.disabled   = true;
      actionNote.textContent = '';
      _fabBarShow();
      break;
    }
    case 'playing':
      btnMain.textContent = '⏸ Pause';
      btnMain.disabled    = false;
      btnReset.disabled   = false;
      actionNote.textContent = '';
      if (_landscapeFabActive) _fabBarHide();
      break;
    case 'paused':
      btnMain.textContent = '▶ Resume';
      btnMain.disabled    = false;
      btnReset.disabled   = false;
      actionNote.textContent = '';
      _fabBarShow();
      break;
    case 'ended':
      btnMain.textContent    = '↺ Replay';
      btnMain.disabled       = false;
      btnReset.disabled      = false;
      actionNote.textContent = '✓ Explore complete!';
      _fabBarShow();
      break;
    case 'counting':
      btnMain.textContent    = '✕ Cancel';
      btnMain.disabled       = false;
      btnReset.disabled      = true;
      actionNote.textContent = '';
      break;
  }
}

// Button handlers

// Main button: Start / Pause / Resume / Replay
btnMain.onclick = () => {
  _audioResume();  // browser autoplay policy: resume AudioContext on user gesture

  // Cancel count-in if in progress
  if (uiState === 'counting') {
    countIn.cancel();
    readingWindow.cancelAnimation();
    _setUIState('idle');
    return;
  }

  if (uiState === 'idle' || uiState === 'ended') {
    _diagNgrLog('PLAY-START'); // DIAG — active map should be ∅ at play start
    lastBar = -1;

    // Ended: stop engine and clear highlights before replay
    if (uiState === 'ended') {
      runtime.stop();
      renderer.clearAll();  // stop() does not fire exits
      keyboardViz.clear();
    }

    // Resolve start bar and play params from current scope
    let startBar = 1;
    let playParams;
    if (practiceLoop.active) {
      startBar   = practiceLoop.start_bar ?? 1;
      playParams = { start_ms: practiceLoop.start_ms, end_ms: practiceLoop.end_ms, tempoScale: currentTempoScale };
    } else {
      const seg = activeSegmentIndex >= 0 ? songLoader.resolvedSegments[activeSegmentIndex] : null;
      if (seg) {
        startBar   = seg.start_bar ?? 1;
        playParams = { start_ms: seg.start_ms, end_ms: seg.end_ms ?? Infinity, tempoScale: currentTempoScale };
      } else {
        startBar   = 1;
        playParams = { partId: songLoader.selectedPart || undefined, tempoScale: currentTempoScale };
      }
    }

    // Instant scroll to start — cancels any in-progress scroll-back animation.
    // Direct reset first (guarantees both axes return to origin for bar 1),
    // then scrollToBar fine-tunes for non-bar-1 practice loop / segment starts.
    const _vpEl = document.getElementById('notation-viewport');
    _vpEl.scrollTop  = 0;
    _vpEl.scrollLeft = 0;
    if (startBar !== 1) renderer.scrollToBar(startBar, { instant: true });
    readingWindow.cancelAnimation();

    // Count-in → then play
    const timeSigArr = currentSong?.meta?.time_signature ?? [4, 4];
    const timeSig    = `${timeSigArr[0]}/${timeSigArr[1]}`;
    const bpm        = currentSong?.meta?.bpm ?? 120;

    countIn.start({
      timeSig,
      bpm,
      tempoScale: currentTempoScale,
      onComplete: () => {
        runtime.play(playParams);
        _playbackAudioOrigin = { ctxTime: _audioCtx.currentTime + 0.025, songMs: runtime.scopeStart, tempoScale: currentTempoScale };
        _setUIState('playing');
      },
    });
    _setUIState('counting');

  } else if (uiState === 'playing') {
    runtime.pause();
    _setUIState('paused');

  } else if (uiState === 'paused') {
    // Resume — runtime.play() from paused preserves position (per runtime-contract §3)
    runtime.play({ tempoScale: currentTempoScale });
    _playbackAudioOrigin = { ctxTime: _audioCtx.currentTime + 0.012, songMs: runtime.currentTime, tempoScale: currentTempoScale };
    _setUIState('playing');
  }
};

// Reset — always goes back to idle
btnReset.onclick = () => {
  _diagNgrLog('RESET-STOP'); // DIAG — imbalance here = events mid-flight at stop
  countIn.cancel();
  readingWindow.cancelAnimation();
  runtime.stop();
  renderer.clearAll();  // stop() does not fire exits
  keyboardViz.clear();
  lastBar = -1;
  _updateProgress(0);
  _updateTime(0);
  _updateStatusBarNum(-1);
  _setUIState('idle');
};

progressWrap.onclick = e => {
  if (uiState !== 'playing' && uiState !== 'paused') return;
  const rect  = progressWrap.getBoundingClientRect();
  const pct   = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const start = runtime.scopeStart;
  const end   = runtime.scopeEnd === Infinity ? runtime.duration : runtime.scopeEnd;
  // seek() fires onEventExit for active events before repositioning (renderer clears via callback)
  runtime.seek(start + pct * (end - start));
};

// -----------------------------------------------------------------------
// Note Name Mode — presentation-layer display mapping (Task 5)
// Maps keyboard note labels to Letter / Solfège / Numbers.
// Runtime-only: does NOT touch MIDI data, playback, or renderer semantics.
// -----------------------------------------------------------------------

let _noteNameMode = 'letter';

const _SOLFEGE = ['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const _NUMBERS  = ['1','1♯','2','2♯','3','4','4♯','5','5♯','6','6♯','7'];

function _noteToSemi(letterName) {
  const m = letterName.match(/^([A-G])(#{1,2}|b{1,2})?/);
  if (!m) return -1;
  const steps = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  let s = steps[m[1]] || 0;
  if (m[2]) {
    if (m[2][0] === '#') s += m[2].length;
    else if (m[2][0] === 'b') s -= m[2].length;
  }
  return ((s % 12) + 12) % 12;
}

function _applyNoteNameMode() {
  const mode = _noteNameMode;
  document.querySelectorAll('.nk-kb-note-label').forEach(lbl => {
    if (!lbl.dataset.origName) lbl.dataset.origName = lbl.textContent;
    const semi = _noteToSemi(lbl.dataset.origName);
    if (semi < 0) return;
    if (mode === 'solfege')     lbl.textContent = _SOLFEGE[semi];
    else if (mode === 'number') lbl.textContent = _NUMBERS[semi];
    else                        lbl.textContent = lbl.dataset.origName;
  });
}

const _noteNameModeEl = document.getElementById('noteNameMode');
if (_noteNameModeEl) {
  _noteNameModeEl.addEventListener('change', e => {
    _noteNameMode = e.target.value;
    _applyNoteNameMode();
  });
}

// -----------------------------------------------------------------------
// Note Guidance Row — portrait reading mode companion strip.
// Mirrors the onKeyHighlight feed; shows active note names per clef.
// Clef → side: bass (LH) = left half, treble (RH) = right half.
// Notes sorted lowest → highest by MIDI pitch; dash-separated: Do-Mi-Sol.
// -----------------------------------------------------------------------

(function _initNoteGuidanceRow() {
  const lhEl = document.getElementById('ngrLH');
  const rhEl = document.getElementById('ngrRH');
  if (!lhEl || !rhEl) return;  // HTML element absent — no-op

  // Track active notes per clef: Map<eventId, string[]>
  const _active = { treble: new Map(), bass: new Map() };

  // --- DIAG: expose snapshot accessor for lifecycle logging ---
  window._ngrDiag = Object.assign(window._ngrDiag || {}, {
    enterCount: 0,
    exitCount:  0,
    snapshot() {
      const tArr = [..._active.treble.entries()].map(([id, ns]) => `${id}:[${ns.join(',')}]`);
      const bArr = [..._active.bass.entries()].map(([id, ns]) => `${id}:[${ns.join(',')}]`);
      return {
        treble:     tArr.join(' | ') || '∅',
        bass:       bArr.join(' | ') || '∅',
        trebleSize: _active.treble.size,
        bassSize:   _active.bass.size,
        enterCount: this.enterCount,
        exitCount:  this.exitCount,
        imbalance:  this.enterCount - this.exitCount,
      };
    },
  });
  // --- /DIAG ---

  function _noteToMidi(name) {
    const m = name.match(/^([A-G])(#{1,2}|b{1,2})?(-?\d+)/);
    if (!m) return 0;
    const steps = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
    let s = steps[m[1]] ?? 0;
    if (m[2]) { if (m[2][0] === '#') s += m[2].length; else s -= m[2].length; }
    return (parseInt(m[3]) + 1) * 12 + ((s % 12 + 12) % 12);
  }

  function _noteLabel(name) {
    const semi = _noteToSemi(name);
    if (semi < 0) return name;
    if (_noteNameMode === 'solfege') return _SOLFEGE[semi];
    if (_noteNameMode === 'number')  return _NUMBERS[semi];
    // letter: strip octave number, keep pitch class + accidental
    const m = name.match(/^([A-G](?:#{1,2}|b{1,2})?)/);
    return m ? m[1] : name;
  }

  function _noteLabelHtml(name) {
    const label = _noteLabel(name);
    // Number mode: skip octave suffix (e.g. "5" stays "5")
    if (_noteNameMode === 'number') return label;
    const octMatch = name.match(/(-?\d+)$/);
    if (!octMatch) return label;
    return label + '<span class="ngr-oct">' + octMatch[1] + '</span>';
  }

  function _renderClef(clef) {
    const el   = clef === 'treble' ? rhEl : lhEl;
    const map  = _active[clef];
    const all  = [];
    map.forEach(notes => notes.forEach(n => all.push(n)));
    // Deduplicate by MIDI pitch, sort lowest → highest
    const seen = new Set();
    const sorted = all.filter(n => {
      const midi = _noteToMidi(n);
      if (seen.has(midi)) return false;
      seen.add(midi); return true;
    }).sort((a, b) => _noteToMidi(a) - _noteToMidi(b));

    if (!sorted.length) {
      // Store plain-text key (not innerHTML) so same-name detection stays reliable
      if (el.classList.contains('ngr-active')) {
        el._prevActive = el._lastText || null;
      }
      el._lastText = null;
      el.innerHTML = '—';
      el.classList.remove('ngr-active');
    } else {
      const newText = sorted.map(_noteLabel).join('-');
      // Same-name transition: label matches what was active before the clear
      // → pulse-animate so user sees the note boundary even when name is identical
      if (el._prevActive === newText) {
        el.classList.remove('ngr-pulse');
        void el.offsetWidth; // force reflow to restart animation
        el.classList.add('ngr-pulse');
      }
      el._prevActive = null;
      el._lastText   = newText;
      el.innerHTML   = sorted.map(_noteLabelHtml).join('-');
      el.classList.add('ngr-active');
    }
  }

  // --- DIAG: compare strip active map against renderer active map ---
  function _diagCheckMismatch(clef) {
    const stripMap = _active[clef];
    const staleIds = [];
    stripMap.forEach((notes, id) => {
      if (!_diagRendererActive.has(id)) staleIds.push({ id, notes });
    });
    if (staleIds.length) {
      staleIds.forEach(({ id, notes }) => {
        console.warn(
          `[NGR ⚠ STALE] clef=${clef}  eventId=${id}` +
          `  notes=[${notes.join(',')}]` +
          `  → IN strip active map but NOT in renderer active set`
        );
      });
    }
  }
  // --- /DIAG ---

  _ngrUpdate = function(kh) {
    if (!kh) return;
    if (kh.type === 'clear') {
      // --- DIAG ---
      console.log(`[NGR CLEAR] t=${Math.round(_diagTime)}ms`);
      // --- /DIAG ---
      _active.treble.clear(); _active.bass.clear();
      _renderClef('treble'); _renderClef('bass');
      return;
    }
    const map = _active[kh.clef];
    if (!map) return;
    if (kh.type === 'enter') {
      map.set(kh.eventId, kh.notes || []);
      window._ngrDiag.enterCount++; // DIAG
    } else if (kh.type === 'exit') {
      map.delete(kh.eventId);
      window._ngrDiag.exitCount++; // DIAG
    }

    // --- DIAG ---
    const _tStr = [..._active.treble.entries()].map(([id, ns]) => `${id}:[${ns.join(',')}]`).join(' | ') || '∅';
    const _bStr = [..._active.bass.entries()].map(([id, ns]) => `${id}:[${ns.join(',')}]`).join(' | ') || '∅';
    console.log(
      `[NGR ${kh.type.toUpperCase().padEnd(5)}] t=${Math.round(_diagTime)}ms` +
      `  id=${kh.eventId}  clef=${kh.clef}  notes=[${(kh.notes||[]).join(',')}]`
    );
    console.log(`[NGR STATE] treble={${_tStr}}  bass={${_bStr}}`);
    _diagCheckMismatch(kh.clef);
    // --- /DIAG ---

    _renderClef(kh.clef);
  };

  // Re-render when main note name selector changes
  document.getElementById('noteNameMode')?.addEventListener('change', () => {
    _renderClef('treble'); _renderClef('bass');
    _syncNoteModePick();
  });

  const fabNoteModePick = document.getElementById('fabNoteModePick');
  const fabNoteModeBtn  = document.getElementById('fabNoteModeBtn');

  function _syncNoteModePick() {
    if (!fabNoteModePick) return;
    fabNoteModePick.querySelectorAll('.fab-pick-item').forEach(btn => {
      btn.classList.toggle('fab-pick-active', btn.dataset.mode === _noteNameMode);
    });
  }

  function _applyNoteMode(mode) {
    _noteNameMode = mode;
    const mainSel = document.getElementById('noteNameMode');
    if (mainSel) mainSel.value = mode;
    _applyNoteNameMode();
    _renderClef('treble'); _renderClef('bass');
  }

  if (fabNoteModePick) {
    fabNoteModePick.querySelectorAll('.fab-pick-item').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        _applyNoteMode(btn.dataset.mode);
        fabNoteModePick.classList.remove('fab-panel-open');
        fabNoteModePick.setAttribute('aria-hidden', 'true');
      });
    });
  }

  if (fabNoteModeBtn) {
    fabNoteModeBtn.addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = fabNoteModePick?.classList.contains('fab-panel-open');
      // close all other panels
      document.getElementById('fabTempoPick')?.classList.remove('fab-panel-open');
      document.getElementById('fabTempoPick')?.setAttribute('aria-hidden', 'true');
      document.getElementById('fabSongPanel')?.classList.remove('fab-panel-open');
      document.getElementById('fabSongBtn')?.classList.remove('fab-song-open');
      document.getElementById('fabToolsPanel')?.classList.remove('fab-panel-open');
      document.getElementById('fabToolsBtn')?.classList.remove('fab-tools-open');
      if (fabNoteModePick) {
        if (isOpen) {
          fabNoteModePick.classList.remove('fab-panel-open');
          fabNoteModePick.setAttribute('aria-hidden', 'true');
        } else {
          _syncNoteModePick();
          fabNoteModePick.classList.add('fab-panel-open');
          fabNoteModePick.setAttribute('aria-hidden', 'false');
        }
      }
    });
  }

  // Close note mode pick on outside click
  document.addEventListener('click', () => {
    fabNoteModePick?.classList.remove('fab-panel-open');
    fabNoteModePick?.setAttribute('aria-hidden', 'true');
  });
})();

// -----------------------------------------------------------------------
// FAB bar drag — optional vertical repositioning by user.
// Only the drag handle (⠿) is draggable; rest of bar remains tap-only.
// Position resets on resize/orientationchange (safe bounds change).
// -----------------------------------------------------------------------
(function _initFabDrag() {
  const fabBar     = document.getElementById('fabBar');
  const dragHandle = document.getElementById('fabDragHandle');
  if (!fabBar || !dragHandle) return;

  let dragging    = false;
  let startY      = 0;
  let startBottom = 0;

  function _getKbH() {
    return parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--fab-kb-h')
    ) || 0;
  }

  function _clampBottom(val) {
    const kbH    = _getKbH();
    const barH   = fabBar.offsetHeight;
    const isPort = document.body.classList.contains('nk-portrait');
    // In portrait: strip (63px) is at top — keep bar from overlapping it
    const maxBot = window.innerHeight - barH - (isPort ? 63 : 0) - 10;
    const minBot = kbH + 6;
    return Math.max(minBot, Math.min(maxBot, val));
  }

  dragHandle.addEventListener('pointerdown', e => {
    dragging    = true;
    startY      = e.clientY;
    const rect  = fabBar.getBoundingClientRect();
    startBottom = window.innerHeight - rect.bottom;
    dragHandle.setPointerCapture(e.pointerId);
    fabBar.style.transition = 'none';
    e.preventDefault();
  });

  dragHandle.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy        = e.clientY - startY;       // positive = moved finger down
    const newBottom = _clampBottom(startBottom - dy);
    fabBar.style.bottom = newBottom + 'px';
  });

  dragHandle.addEventListener('pointerup', () => {
    dragging = false;
    fabBar.style.transition = '';
  });

  dragHandle.addEventListener('pointercancel', () => {
    dragging = false;
    fabBar.style.transition = '';
  });

  // Reset to CSS-computed default whenever screen geometry changes
  function _resetPos() { fabBar.style.bottom = ''; }
  window.addEventListener('resize',            _resetPos, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(_resetPos, 120), { passive: true });
})();

// -----------------------------------------------------------------------
// Status bar — bar number updater (Task 6)
// -----------------------------------------------------------------------

function _updateStatusBarNum(bar) {
  const el = document.getElementById('statusBarNum');
  if (el) el.textContent = (bar != null && bar >= 0) ? String(bar) : '—';
  _updateFabInfoRow(bar);
}

function _barToSegmentLabel(bar) {
  const segs = songLoader.resolvedSegments;
  if (!segs || !segs.length) return null;
  // Segments share boundary bars (end_bar of seg N == start_bar of seg N+1).
  // "Last segment whose start_bar <= bar" is correct: at the boundary bar,
  // the incoming segment wins over the outgoing one.
  let result = null;
  for (const seg of segs) {
    if (seg.start_bar <= bar) result = seg.label;
    else break;
  }
  return result;
}

function _updateFabInfoRow(bar) {
  const barEl  = document.getElementById('fabInfoBar');
  const partEl = document.getElementById('fabInfoPart');
  if (!barEl || !partEl) return;
  const active = bar != null && bar >= 0;
  const barTxt  = active ? String(bar) : '—';
  const partTxt = active ? (_barToSegmentLabel(bar) ?? '—') : '—';
  barEl.textContent  = barTxt;
  partEl.textContent = partTxt;
  const ngrBar  = document.getElementById('ngrMetaBar');
  const ngrPart = document.getElementById('ngrMetaPart');
  if (ngrBar)  ngrBar.textContent  = barTxt;
  if (ngrPart) ngrPart.textContent = partTxt;
}

// -----------------------------------------------------------------------
// FAB overlay wiring — proxy + MutationObserver pattern.
// Existing functions and variables are NOT modified; this block only
// observes them and mirrors state to the overlay elements.
// Disable: set FAB_CONTROLS = false at top of script.
// -----------------------------------------------------------------------
(function _initFab() {
  // Only wire when the class was added on page load. The toggle button
  // can later add/remove the class dynamically; observers remain active.
  const fabBtnMain    = document.getElementById('fabBtnMain');
  const fabPracticeBtn = document.getElementById('fabPracticeBtn');
  const fabHandBtn    = document.getElementById('fabHandBtn');
  const fabTempoBtn   = document.getElementById('fabTempoBtn');
  const fabTempoPick  = document.getElementById('fabTempoPick');
  const fabProgressWr = document.getElementById('fabProgressWrap');
  const fabProgressFl = document.getElementById('fabProgressFill');
  const fabSongPanel  = document.getElementById('fabSongPanel');
  const fabSongList   = document.getElementById('fabSongList');
  const fabSongBtn    = document.getElementById('fabSongBtn');
  const fabSongClose  = document.getElementById('fabSongClose');
  const origTempoSel  = document.getElementById('tempoSelect');

  if (!fabBtnMain) return;  // overlay not in DOM

  // --- Transport: play/pause/resume (mirrors YouTube behaviour) ---
  fabBtnMain.onclick = () => btnMain.onclick?.();

  // Practice — placeholder, no functionality yet.
  fabPracticeBtn.onclick = () => {};

  // --- Tempo picker ---
  function _syncTempoPick() {
    if (!fabTempoPick) return;
    const cur = origTempoSel?.value || '1.0000';
    fabTempoPick.querySelectorAll('.fab-pick-item').forEach(btn => {
      btn.classList.toggle('fab-pick-active', btn.dataset.val === cur);
    });
  }

  if (fabTempoPick) {
    fabTempoPick.querySelectorAll('.fab-pick-item').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (origTempoSel) { origTempoSel.value = btn.dataset.val; origTempoSel.dispatchEvent(new Event('change')); }
        fabTempoPick.classList.remove('fab-panel-open');
        fabTempoPick.setAttribute('aria-hidden', 'true');
      });
    });
  }

  if (fabTempoBtn) {
    fabTempoBtn.addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = fabTempoPick?.classList.contains('fab-panel-open');
      // close all other panels
      document.getElementById('fabNoteModePick')?.classList.remove('fab-panel-open');
      document.getElementById('fabNoteModePick')?.setAttribute('aria-hidden', 'true');
      _fabClosePanel();
      _fabCloseTools();
      if (fabTempoPick) {
        if (isOpen) {
          fabTempoPick.classList.remove('fab-panel-open');
          fabTempoPick.setAttribute('aria-hidden', 'true');
        } else {
          _syncTempoPick();
          fabTempoPick.classList.add('fab-panel-open');
          fabTempoPick.setAttribute('aria-hidden', 'false');
        }
      }
    });
  }

  // Close tempo pick on outside click
  document.addEventListener('click', () => {
    fabTempoPick?.classList.remove('fab-panel-open');
    fabTempoPick?.setAttribute('aria-hidden', 'true');
  });

  // --- Progress bar seek ---
  fabProgressWr.addEventListener('click', e => {
    if (uiState !== 'playing' && uiState !== 'paused') return;
    const rect  = fabProgressWr.getBoundingClientRect();
    const pct   = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const start = runtime.scopeStart;
    const end   = runtime.scopeEnd === Infinity ? runtime.duration : runtime.scopeEnd;
    runtime.seek(start + pct * (end - start));
  });

  // --- MutationObservers: keep FAB state mirrored ---

  // Main button label + disabled state — 3-state transport labels
  const _syncMain = () => {
    if (uiState === 'playing') fabBtnMain.textContent = '❚❚';
    else fabBtnMain.textContent = '▶';
    fabBtnMain.disabled = btnMain.disabled;
  };
  _syncMain();
  new MutationObserver(_syncMain).observe(btnMain, {
    childList: true, subtree: true, characterData: true, attributes: true,
  });

  // Progress fill width
  new MutationObserver(() => {
    fabProgressFl.style.width = progressFill.style.width;
  }).observe(progressFill, { attributes: true, attributeFilter: ['style'] });

  // Song title sync — mirror #songTitle into the NGR strip
  const fabNgrTitleEl = document.getElementById('fabNgrTitle');
  const songTitleEl   = document.getElementById('songTitle');
  if (fabNgrTitleEl && songTitleEl) {
    const _syncNgrTitle = () => { fabNgrTitleEl.textContent = songTitleEl.textContent; };
    _syncNgrTitle();
    new MutationObserver(_syncNgrTitle).observe(songTitleEl, {
      childList: true, subtree: true, characterData: true,
    });
  }

  // --- Song picker ---
  function _fabBuildSongList() {
    fabSongList.innerHTML = '';
    const current = songSelect.value;
    Array.from(songSelect.options).forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'fab-song-item' + (opt.value === current ? ' fab-song-active' : '');
      btn.textContent = opt.dataset.title || opt.textContent;
      btn.onclick = () => {
        songSelect.value = opt.value;
        songSelect.dispatchEvent(new Event('change'));
        _fabClosePanel();
      };
      fabSongList.appendChild(btn);
    });

  function _fabClosePanel() {
    fabSongPanel.classList.remove('fab-panel-open');
    fabSongPanel.setAttribute('aria-hidden', 'true');
    fabSongBtn.classList.remove('fab-song-open');
  }

  fabSongBtn.onclick = () => {
    if (fabSongPanel.classList.contains('fab-panel-open')) {
      _fabClosePanel();
    } else {
      _fabBuildSongList();
      _fabCloseTools();
      fabTempoPick?.classList.remove('fab-panel-open');
      fabTempoPick?.setAttribute('aria-hidden', 'true');

      document.getElementById('fabNoteModePick')?.setAttribute('aria-hidden', 'true');
      fabSongPanel.classList.add('fab-panel-open');
      fabSongPanel.setAttribute('aria-hidden', 'false');
      fabSongBtn.classList.add('fab-song-open');
    }
  };
  fabSongClose.onclick = _fabClosePanel;

  // ---- Tools panel (hand + part selection) --------------------------------

  const fabToolsBtn   = document.getElementById('fabToolsBtn');
  const fabHandPanel  = document.getElementById('fabHandPanel');
  const fabToolsPanel = document.getElementById('fabToolsPanel');
  const fabPartSect   = document.getElementById('fabPartSection');
  const fabPartSel    = document.getElementById('fabPartSelect');
  const fabHandBtns   = Array.from(document.querySelectorAll('#fabHandSection .fab-tools-hand-btn'));
  const origHandSel   = document.getElementById('handSelect');

  function _fabCloseHand() {
    fabHandPanel.classList.remove('fab-panel-open');
    fabHandPanel.setAttribute('aria-hidden', 'true');
  }

  function _fabCloseTools() {
    fabToolsPanel.classList.remove('fab-panel-open');
    fabToolsPanel.setAttribute('aria-hidden', 'true');
    fabToolsBtn.classList.remove('fab-tools-open');
  }

  function _fabSyncHandBtns() {
    const val = origHandSel?.value || 'both';
    fabHandBtns.forEach(b => {
      b.classList.toggle('fab-tools-hand-active', b.dataset.clef === val);
    });
  }

  function _fabSyncPart() {
    const origSeg = document.getElementById('segmentSelect');
    if (!origSeg) {
      fabPartSect.style.display = 'none';
      return;
    }
    fabPartSect.style.display = '';
    fabPartSel.innerHTML = origSeg.innerHTML;
    fabPartSel.value = origSeg.value;
  }

  _fabSyncHandBtns();
  _fabSyncPart();

  fabHandBtns.forEach(btn => {
    btn.onclick = () => {
      if (origHandSel) {
        origHandSel.value = btn.dataset.clef;
        // bubbles:true — parent delegate listener on #learningRow fires correctly
        origHandSel.dispatchEvent(new Event('change', { bubbles: true }));
      }
      _fabSyncHandBtns();
      _fabCloseHand();
    };
