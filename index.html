  fabPartSel.onchange = function() {
    const origSeg = document.getElementById('segmentSelect');
    if (origSeg) {
      origSeg.value = this.value;
      // bubbles:true — parent delegate listener on #segmentsBar fires correctly
      origSeg.dispatchEvent(new Event('change', { bubbles: true }));
    }
    _fabCloseTools();
  };

  if (origHandSel) {
    origHandSel.addEventListener('change', _fabSyncHandBtns);
  }

  // Re-sync part select when segmentsBar changes (song load builds/removes it)
  const segmentsBarEl = document.getElementById('segmentsBar');
  if (segmentsBarEl) {
    new MutationObserver(_fabSyncPart).observe(segmentsBarEl, { childList: true, subtree: true });
  }

  fabToolsBtn.onclick = () => {
    if (fabToolsPanel.classList.contains('fab-panel-open')) {
      _fabCloseTools();
    } else {
      _fabSyncPart();
      _fabClosePanel();
      _fabCloseHand();
      fabTempoPick?.classList.remove('fab-panel-open');
      fabTempoPick?.setAttribute('aria-hidden', 'true');
      document.getElementById('fabNoteModePick')?.classList.remove('fab-panel-open');
      document.getElementById('fabNoteModePick')?.setAttribute('aria-hidden', 'true');
      fabToolsPanel.classList.add('fab-panel-open');
      fabToolsPanel.setAttribute('aria-hidden', 'false');
      fabToolsBtn.classList.add('fab-tools-open');
    }
  };

  // Hand button — opens the Hand panel only.
  if (fabHandBtn) fabHandBtn.onclick = () => {
    if (fabHandPanel.classList.contains('fab-panel-open')) {
      _fabCloseHand();
    } else {
      _fabSyncHandBtns();
      _fabClosePanel();
      _fabCloseTools();
      fabTempoPick?.classList.remove('fab-panel-open');
      fabTempoPick?.setAttribute('aria-hidden', 'true');
      document.getElementById('fabNoteModePick')?.classList.remove('fab-panel-open');
      document.getElementById('fabNoteModePick')?.setAttribute('aria-hidden', 'true');
      fabHandPanel.classList.add('fab-panel-open');
      fabHandPanel.setAttribute('aria-hidden', 'false');
    }
  };

  // Close all panels on score or keyboard interaction
  document.querySelector('.score-card')?.addEventListener('pointerdown', () => {
    _fabClosePanel();
    _fabCloseTools();
    _fabCloseHand();
  }, { passive: true });

  // _syncKbHeight hoisted to module scope — see below IIFE
  _syncKbHeight();
  window.addEventListener('resize', _syncKbHeight, { passive: true });
  // Re-measure after song loads (keyboard range may change key count)
  setTimeout(_syncKbHeight, 600);

  // -----------------------------------------------------------------------
  // NGR Part picker — click the yellow Part value to pick a segment
  // -----------------------------------------------------------------------
  const ngrPartPick    = document.getElementById('fabNgrPartPick');

  function _ngrPartPickClose() {

  function _ngrPartPickOpen() {

  // Close NGR part picker on outside interaction
  document.addEventListener('pointerdown', e => {
    if (!ngrPartPick.classList.contains('fab-panel-open')) return;
    if (!ngrPartPick.contains(e.target) && e.target !== ngrMetaPartEl) _ngrPartPickClose();

  // Landscape playback: tap anywhere to reveal FAB bar, auto-hide after 3s of no interaction
  document.addEventListener('pointerdown', () => {
    if (!_landscapeFabActive || uiState !== 'playing') return;
    _fabBarShow();
    _fabBarScheduleHide(3000);
  }, { passive: true });

  // -----------------------------------------------------------------------
  // NGR Bar input — click the yellow Bar value to jump to a specific bar
  // -----------------------------------------------------------------------
  const ngrMetaBarEl = document.getElementById('ngrMetaBar');
  const ngrBarInput  = document.getElementById('ngrBarInput');

  function _barInputCommit() {
    const bars = currentSong?.score?.bars;
    if (!bars?.length) { _barInputClose(); return; }
    const val = parseInt(ngrBarInput.value, 10);
    _barInputClose();
    if (!isNaN(val) && val >= bars[0].bar && val <= bars[bars.length - 1].bar) {
      renderer.scrollToBar(val);
    }
  }

  function _barInputClose() {
    ngrBarInput.style.display = 'none';
    if (ngrMetaBarEl) ngrMetaBarEl.style.display = '';
  }

  if (ngrMetaBarEl && ngrBarInput) {
    ngrMetaBarEl.addEventListener('click', e => {
      e.stopPropagation();
      const bars = currentSong?.score?.bars;
      if (!bars?.length) return;
      ngrBarInput.min   = bars[0].bar;
      ngrBarInput.max   = bars[bars.length - 1].bar;
      ngrBarInput.value = ngrMetaBarEl.textContent !== '—' ? ngrMetaBarEl.textContent : bars[0].bar;
      ngrMetaBarEl.style.display = 'none';
      ngrBarInput.style.display  = '';
      ngrBarInput.focus();
      ngrBarInput.select();
    });

    ngrBarInput.addEventListener('blur', _barInputCommit);
    ngrBarInput.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { ngrBarInput.blur(); }
      if (e.key === 'Escape') { _barInputClose(); }
    });
  }

})();

// -----------------------------------------------------------------------
// Keyboard height token — module-scope so _syncLandscapeFab can call it.
// Positions FAB bar above the keyboard via --fab-kb-h CSS var.
// -----------------------------------------------------------------------
function _syncKbHeight() {
  const kbEl = document.querySelector('.kb-wrap');
  document.documentElement.style.setProperty('--fab-kb-h', (kbEl ? kbEl.offsetHeight : 0) + 'px');
}

// -----------------------------------------------------------------------
// Landscape FAB mode — single-row horizontal layout.
// Activated when body.nk-fab-mode is set AND body.nk-portrait is absent.
// Deactivated when either condition changes.
//
// Rules to avoid unnecessary work:
//   - Keyboard + readingWindow only reconfigured when mode actually CHANGES
//   - Score re-renders only on: mode change, OR force=true while landscape FAB active
//     (covers new song load in landscape FAB without double-render in portrait mode)
// -----------------------------------------------------------------------
function _syncLandscapeFab(force) {
  if (!_landscapeFabReady) return;
  const isNow   = document.body.classList.contains('nk-fab-mode') &&
                  !document.body.classList.contains('nk-portrait');
  const changed = isNow !== _landscapeFabActive;
  if (!force && !changed) return;

  if (changed) {
    _landscapeFabActive = isNow;
    if (isNow) {
      // Compact keyboard: W=22 H=58 BW=13 BH=36 LABEL_H=16 → total visual 74px
      keyboardViz.setDimensions(22, 58, 13, 36, 16);
      readingWindow.setScrollAxis('horizontal');
      if (uiState === 'playing') _fabBarHide();
    } else {
      keyboardViz.restoreDefaults();
      readingWindow.setScrollAxis('vertical');
      _fabBarShow();
      // Reset horizontal scroll accumulated during landscape mode; without this
      // the viewport stays shifted left in portrait, hiding bar(s) at the left edge.
      const _vpEl = document.getElementById('notation-viewport');
      if (_vpEl) _vpEl.scrollLeft = 0;
    }
    setTimeout(_syncKbHeight, 60);
  }

  // Re-render: always on mode change; on force only when already in landscape FAB
  // (prevents double-render when a song loads while not in landscape FAB mode).
  const needsRender = changed || (force && isNow);
  if (!currentSong || !needsRender) {
    if (!isNow && viewportManager.isFitMode) {
      // EXPERIMENT: sync to actual canvas width before fitting (may be 480 for 1-bar portrait)
      if (renderer.canvasWidth) viewportManager.setNaturalWidth(renderer.canvasWidth);
      viewportManager.fitWidth();
    }
    return;
  }

  const clef        = learningState.clefFilter;
  const visibleClefs = clef === 'both' ? null : [clef];
  const seg          = activeSegmentIndex >= 0 ? songLoader.resolvedSegments[activeSegmentIndex] : null;
  const visibleBars  = practiceLoop.active ? practiceLoop.bars : (seg ? seg.bars : null);

  renderer.render(currentSong, scoreEl, { visibleBars, visibleClefs, barsPerRow: isNow ? 'all' : _portraitBarsPerRow() });

  if (isNow) {
    viewportManager.setNaturalWidth(renderer.canvasWidth);
    viewportManager.fitHeight(renderer.rowHeight + 20);
  } else {
    // EXPERIMENT Very Large Notation: use actual canvas width (may be 480 for 1-bar portrait)
    viewportManager.setNaturalWidth(renderer.canvasWidth);
    viewportManager.fitWidth();
  }
}

// -----------------------------------------------------------------------
// Song library — fetch songs/index.json and populate dropdown
// Adding a new song requires only: save song.json to songs/, then run
// python tools/update_song_index.py (or edit songs/index.json directly).
// -----------------------------------------------------------------------
async function _initSongLibrary() {
  try {
    const res = await fetch('songs/index.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const index = await res.json();
    const allSongs = Array.isArray(index.songs) ? index.songs : [];
    const songs = allSongs.filter(s => s.listed === true);

    songSelect.innerHTML = '';
    if (!songs.length) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'No songs available';
      songSelect.appendChild(opt);
      document.getElementById('songTitle').textContent = 'No songs available';
      return;
    }

    songs.forEach(song => {
      const opt = document.createElement('option');
      opt.value = song.src || '';
      opt.textContent = song.label || song.src || '(no label)';
      opt.dataset.title = song.title || song.label || song.src || '(no label)';
      songSelect.appendChild(opt);
    });

    if (songSelect.value) songLoader.load(songSelect.value);
  } catch (err) {
    console.error('songs/index.json load failed:', err);
    document.getElementById('songTitle').textContent = 'Failed to load song list';
    document.getElementById('score').innerHTML =
      '<div class="score-loading">Cannot load songs/index.json — ' +
      'run: python tools/update_song_index.py</div>';
  }
}

_initSongLibrary();
